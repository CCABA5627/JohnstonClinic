}

function addPodMemberDirect(cid,sid){if(!S.pods[cid])S.pods[cid]=[];if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);markDirty();render();showToast('Added to pod',false);}
function addStaffToPodDirect(sid,cid){if(!S.pods[cid])S.pods[cid]=[];if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);markDirty();render();showToast('Added to pod',false);}
function addPodMember(cid){const sel=document.getElementById('add-pod-sel');if(!sel?.value)return;const sid=sel.value;if(!S.pods[cid])S.pods[cid]=[];if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);markDirty();render();}
function removePodMember(cid,sid){if(!S.pods[cid])return;S.pods[cid]=S.pods[cid].filter(s=>s!==sid);markDirty();render();}
function addStaffToPod(sid){const sel=document.getElementById('add-client-pod-sel');if(!sel?.value)return;const cid=sel.value;if(!S.pods[cid])S.pods[cid]=[];if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);markDirty();render();}

function rCallout(){
  const mode=S.calloutMode||'staff';
  const modeBtns=`<div style="display:flex;gap:6px;margin-bottom:1rem"><button class="btn${mode==='staff'?' btn-p':''}" onclick="S.calloutMode='staff';render()">Staff Callout</button><button class="btn${mode==='client'?'':''}" style="${mode==='client'?'background:#534AB7;color:#fff;border-color:#534AB7':''}" onclick="S.calloutMode='client';render()">Client Cancellation</button></div>`;
  if(mode==='staff'){
    const aff=[];
    const cos=getStaffCallout(S.calloutStaff);
    const allDayOut=cos.some(co=>co.fromM===undefined);
    if(S.calloutStaff){S.clients.forEach(c=>{DAYS.forEach(d=>{(c.schedule[d]||[]).forEach((blk,idx)=>{if(blk.staffId===S.calloutStaff){
      // Only include this block if staff is out during it
      const blkM=t2m(blk.from);
      const isAffected=allDayOut||cos.some(co=>co.fromM!==undefined&&blkM>=co.fromM&&blkM<co.toM);
      if(!isAffected)return;
      const slots=slotsInBlock(blk.from,blk.to);const best=bestForSlot(c.id,d,slots[0],S.calloutStaff);aff.push({cid:c.id,day:d,blockIdx:idx,from:blk.from,to:blk.to,best});}});});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId===S.calloutStaff){const blkM=t2m(tb.from);const isAffected=allDayOut||cos.some(co=>co.fromM!==undefined&&blkM>=co.fromM&&blkM<co.toM);if(!isAffected)return;const best=bestForSlot(tb.cid,tb.day,tb.slots[0],S.calloutStaff);aff.push({cid:tb.cid,day:tb.day,blockIdx:-1,from:tb.from,to:tb.to,best,isTemp:true,tempId:tb.id});}});}
    const calloutDesc=cos.length?cos.map(co=>`<span style="background:#F5C4B3;color:#4A1B0C;padding:1px 8px;border-radius:8px;font-size:11px;">${coLabel(co)}</span>`).join(' '):'not marked out';
    const calloutActions=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
      ${allDayOut
        ?`<button class="btn btn-sm" onclick="rmCO('${S.calloutStaff}')">Mark fully available</button>`
        :`<button class="btn btn-d btn-sm" onclick="mkOut('${S.calloutStaff}')">Mark out all day</button>`}
      ${cos.length&&!allDayOut?`<button class="btn btn-sm" onclick="rmCO('${S.calloutStaff}')">Clear partial callout</button>`:''}
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;">
      <span style="font-size:11px;color:#888;">Partial out:</span>
      <select id="co-partial-from" style="font-size:11px;padding:3px 5px;"><option value="">From...</option>${TIMES.map(t=>`<option>${t}</option>`).join('')}</select>
      <span style="font-size:10px;color:#888;">–</span>
      <select id="co-partial-to" style="font-size:11px;padding:3px 5px;"><option value="">To...</option>${TIMES.map(t=>`<option>${t}</option>`).join('')}</select>
      <button class="btn btn-d btn-sm" onclick="addPartialCallout('${S.calloutStaff}')">Add</button>
    </div>`;
    return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Staff</div>${S.staff.map(s=>{const cos=getStaffCallout(s.id);const allDay=cos.some(co=>co.fromM===undefined);const partial=!allDay&&cos.length>0;return`<div class="si2 ${S.calloutStaff===s.id?'sel':''}" onclick="S.calloutStaff='${s.id}';render()"><div class="av av-s">${ini(s.name)}</div><span class="nm">${s.name}</span>${allDay?'<span class="bx" style="background:#F5C4B3;color:#4A1B0C">Out all day</span>':partial?`<span class="bx" style="background:#FAC775;color:#412402">Partial out</span>`:''}</div>`;}).join('')}</div></div><div class="content">${modeBtns}${!S.calloutStaff?`<div class="es">Select a staff member to see their sessions and coverage options</div>`:`<div class="cob"><div class="cot">\u26a0 ${gsN(S.calloutStaff)?.name}</div><div style="font-size:11px;color:#888;margin-bottom:8px;">Currently out: ${calloutDesc}</div>${calloutActions}</div><div class="card"><div class="ch"><div class="ct">Affected sessions &amp; coverage suggestions</div></div>${aff.length===0?`<div style="font-size:12px;color:#888">No affected sessions${cos.length?' for the marked out time':' — mark a time range above'}.</div>`:aff.map(a=>{const c=gcN(a.cid);return`<div style="padding:8px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div style="display:flex;align-items:center;gap:7px;margin-bottom:6px"><div class="av av-c" style="width:22px;height:22px;font-size:8px">${ini(c?.name||'?')}</div><strong style="font-size:12px">${c?.name} \u2014 ${a.day} ${a.from}${a.from!==a.to?' \u2013 '+a.to:''}${a.isTemp?' (temp)':''}</strong></div>${a.best.length===0?`<div style="font-size:11px;color:#D85A30">No pod members available</div>`:a.best.slice(0,3).map((opt,i)=>{const st=gsN(opt.sid);const tier=i===0?'mg':i===1?'mo':'mp';const lbl=i===0?'Best match':i===1?'Good':'Available';return`<div class="co2"><div style="display:flex;align-items:center;gap:7px"><div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(st?.name||'?')}</div><div><div style="font-size:12px;font-weight:500">${st?.name}</div><div style="font-size:10px;color:#888">${opt.score} overlap</div></div></div><div style="display:flex;align-items:center;gap:6px"><span class="${tier}">${lbl}</span><button class="btn btn-p btn-sm" onclick="doAssign('${a.cid}','${a.day}',${a.blockIdx},'${opt.sid}','${a.tempId||''}');render()">Assign</button></div></div>`;}).join('')}</div>`;}).join('')}</div>`}</div></div>`;
  }
  const selC=gcN(S.calloutClient);
const hasOverride=(S.clientOverrides[S.calloutClient]||[]).length>0;
    const ovList=S.clientOverrides[S.calloutClient]||[];
    const overrideUI=`<div style="margin-top:10px;padding:10px;background:#FFF8EC;border:1px solid #EF9F27;border-radius:8px;">
      <div style="font-size:11px;font-weight:700;color:#b87a00;margin-bottom:6px;">📅 Today-only time adjustment</div>
      ${hasOverride
        ?`<div style="font-size:12px;color:#b87a00;margin-bottom:8px;">${ovList.map(o=>`Block adjusted: <strong>${o.from} – ${o.to}</strong>`).join('<br>')}</div>
           <button class="btn btn-sm" onclick="clearClientOverride('${S.calloutClient}')">✕ Clear all overrides</button>`
        :`<div style="font-size:11px;color:#888;margin-bottom:6px;">Use the Today tab sidebar "📅 Today-only schedule adjust" section to adjust individual blocks.</div>`
      }
    </div>`;
  let freedStaff=[];
  if(isCancelled&&selC){const freedSlots={};DAYS.forEach(d=>{(selC.schedule[d]||[]).forEach(blk=>{if(!blk.staffId)return;if(!freedSlots[blk.staffId])freedSlots[blk.staffId]=[];freedSlots[blk.staffId].push({day:d,from:blk.from,to:blk.to});});});freedStaff=Object.entries(freedSlots).map(([sid,slots])=>({sid,slots,name:gsN(sid)?.name||'?'}));}
  return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Clients</div>${S.clients.map(c=>{const cancelled=S.calledOutClients.includes(c.id);const hasOv=(S.clientOverrides[c.id]||[]).length>0;return`<div class="si2 ${S.calloutClient===c.id?'sel':''}" onclick="S.calloutClient='${c.id}';render()"><div class="av av-c">${ini(c.name)}</div><span class="nm">${c.name}</span>${cancelled?'<span class="bx" style="background:#EEEDFE;color:#3C3489">Cancelled</span>':hasOv?'<span class="bx" style="background:#FFF8EC;color:#b87a00">Adjusted</span>':''}</div>`;}).join('')}</div></div><div class="content">${modeBtns}${!S.calloutClient?`<div class="es">Select a client to manage their today settings</div>`:`<div class="cob" style="background:#F0F0FE;border-color:#AFA9EC;"><div class="cot" style="color:#3C3489;">📵 ${selC?.name}</div><div style="font-size:12px;color:#534AB7;margin-bottom:.625rem">Cancelling removes all their sessions from Today's view and frees up their assigned staff.</div><div style="display:flex;gap:6px">${isCancelled?`<button class="btn btn-sm" onclick="rmClientCO('${S.calloutClient}')">✓ Restore — mark as attending</button>`:`<button class="btn btn-sm" style="background:#534AB7;color:#fff;border-color:#534AB7" onclick="mkClientCO2('${S.calloutClient}')">Mark ${selC?.name} as cancelled today</button>`}</div>${!isCancelled?overrideUI:''}</div>${isCancelled&&freedStaff.length>0?`<div class="card"><div class="ch"><div class="ct">🟢 Staff now freed up</div></div><p style="font-size:12px;color:#888;margin-bottom:.75rem">These staff members had sessions with ${selC?.name} and are now available.</p>${freedStaff.map(f=>`<div style="padding:10px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div class="av av-s" style="width:28px;height:28px">${ini(f.name)}</div><strong style="font-size:13px">${f.name}</strong></div><div style="display:flex;flex-wrap:wrap;gap:5px">${f.slots.map(sl=>`<span style="background:#E1F5EE;color:#085041;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600">${sl.day} ${sl.from} \u2013 ${sl.to} \u2014 now free</span>`).join('')}</div></div>`).join('')}</div>`:''}${!isCancelled?`<div class="card"><div class="ch"><div class="ct">Scheduled sessions for ${selC?.name}</div></div>${DAYS.map(d=>{const blocks=selC?.schedule[d]||[];if(!blocks.length)return'';return`<div style="padding:6px 0;border-bottom:0.5px solid rgba(0,0,0,.08)"><strong style="font-size:11px;color:#534AB7">${d}</strong><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:5px">${blocks.map(blk=>`<span style="background:#E6F1FB;color:#185FA5;padding:2px 9px;border-radius:8px;font-size:11px">${blk.from} \u2013 ${blk.to}${blk.staffId?' \u2014 '+gsN(blk.staffId)?.name:' \u2014 unassigned'}</span>`).join('')}</div></div>`;}).join('')||'<div style="font-size:12px;color:#888">No scheduled sessions.</div>'}</div>`:''}`}</div></div>`;

function rAG(s){const assignedBlocks={};DAYS.forEach(d=>{assignedBlocks[d]=[];});S.clients.forEach(c=>{DAYS.forEach(d=>{(c.schedule[d]||[]).forEach(blk=>{if(blk.staffId!==s.id)return;assignedBlocks[d].push({clientName:c.name,from:blk.from,to:blk.to});});});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId!==s.id)return;if(!assignedBlocks[tb.day])assignedBlocks[tb.day]=[];assignedBlocks[tb.day].push({clientName:(gcN(tb.cid)?.name||'?')+' (temp)',from:tb.from,to:tb.to});});const slotMap={};DAYS.forEach(d=>{slotMap[d]={};(assignedBlocks[d]||[]).forEach(blk=>{slotsInBlock(blk.from,blk.to).forEach(sl=>{if(!slotMap[d][sl])slotMap[d][sl]=[];slotMap[d][sl].push(blk);});});});const SLOT_H=22,COL_W=110,LABEL_W=135;let out='';out+=`<div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.625rem;font-size:10px;color:#777"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#9FE1CB;display:inline-block"></span>Scheduled</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E6F1FB;border:0.5px solid #85B7EB;display:inline-block"></span>Available</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#f0f0ee;display:inline-block"></span>Unavailable</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1.5px solid #D85A30;display:inline-block"></span>&#x26A0; Conflict</span></div>`;out+=`<div style="overflow-x:auto"><table style="border-collapse:collapse;min-width:${LABEL_W+COL_W*5}px"><thead><tr><th style="width:${LABEL_W}px;background:#fff;position:sticky;top:0;z-index:3;border-right:1px solid rgba(0,0,0,.08)"></th>`;DAYS.forEach(d=>{const hasConflict=TIMES.some(t=>(slotMap[d][t]||[]).length>1);out+=`<th style="width:${COL_W}px;text-align:center;font-size:10px;font-weight:500;color:#888;padding:4px 3px;text-transform:uppercase;background:#fff;position:sticky;top:0;z-index:2">${d}${hasConflict?' <span style="color:#D85A30">&#x26A0;</span>':''}</th>`;});out+=`</tr></thead><tbody>`;const consumed={};DAYS.forEach(d=>{consumed[d]=new Set();});TIMES.forEach(t=>{out+=`<tr>`;const nextIdx=TIMES.indexOf(t)+1;const nextT=nextIdx<TIMES.length?TIMES[nextIdx]:null;out+=`<td style="font-size:9px;color:#999;text-align:right;padding:0 8px 0 0;height:${SLOT_H}px;white-space:nowrap;vertical-align:middle;border-right:1px solid rgba(0,0,0,.08)">${nextT?t+' \u2013 '+nextT:t}</td>`;DAYS.forEach(d=>{if(consumed[d].has(t))return;const av=(s.availability[d]||[]).includes(t);const blocks=slotMap[d][t]||[];if(blocks.length===0){out+=av?`<td style="background:#E6F1FB;border:0.5px solid #85B7EB;height:${SLOT_H}px"></td>`:`<td style="background:#f0f0ee;border:0.5px solid rgba(0,0,0,.07);height:${SLOT_H}px"></td>`;return;}if(blocks.length>1){let runEnd=TIMES.indexOf(t);while(runEnd+1<TIMES.length){const next=TIMES[runEnd+1];if((slotMap[d][next]||[]).length>1)runEnd++;else break;}const runSlots=TIMES.slice(TIMES.indexOf(t),runEnd+1);const rowspan=runSlots.length;runSlots.slice(1).forEach(sl=>consumed[d].add(sl));const blockH=rowspan*SLOT_H;const names=blocks.map(b=>b.clientName);const displayNames=names.join(' & ');const shortNames=displayNames.length>20?displayNames.slice(0,19)+'\u2026':displayNames;const segTo=runSlots[runSlots.length-1];out+=`<td rowspan="${rowspan}" style="vertical-align:top;padding:2px;border:0.5px solid rgba(0,0,0,.06)"><div style="background:#FAECE7;border:2px solid #D85A30;border-radius:5px;height:${blockH-6}px;padding:4px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start"><div style="font-size:11px;font-weight:700;color:#D85A30;white-space:nowrap">&#x26A0; Conflict</div><div style="font-size:10px;color:#993C1D;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortNames}</div><div style="font-size:9px;color:#993C1D;margin-top:1px">${t} \u2013 ${segTo}</div></div></td>`;return;}const blk=blocks[0];const blockSlots=slotsInBlock(blk.from,blk.to);const startIdx=blockSlots.indexOf(t);if(startIdx<0){out+=`<td style="background:#f0f0ee;border:0.5px solid rgba(0,0,0,.07);height:${SLOT_H}px"></td>`;return;}let runEnd=startIdx;while(runEnd+1<blockSlots.length){const next=blockSlots[runEnd+1];if(consumed[d].has(next))break;if((slotMap[d][next]||[]).length>1)break;if((slotMap[d][next]||[])[0]!==blk)break;runEnd++;}const runSlots=blockSlots.slice(startIdx,runEnd+1);const rowspan=runSlots.length;runSlots.slice(1).forEach(sl=>consumed[d].add(sl));const blockH=rowspan*SLOT_H;const shortName=blk.clientName.length>14?blk.clientName.slice(0,13)+'\u2026':blk.clientName;out+=`<td rowspan="${rowspan}" style="vertical-align:top;padding:2px;border:0.5px solid rgba(0,0,0,.06)"><div style="background:#9FE1CB;border:1px solid #1D9E75;border-radius:5px;height:${blockH-6}px;padding:4px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start"><div style="font-size:11px;font-weight:600;color:#04342C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortName}</div><div style="font-size:10px;color:#0F6E56;margin-top:2px">${blk.from} \u2013 ${blk.to}</div></div></td>`;});out+=`</tr>`;});out+=`</tbody></table></div>`;return out;}

  const rawOvList=S.clientOverrides[cid];
  const ovList=Array.isArray(rawOvList)?rawOvList:[];

  // How many blocks to show today — default to permanent schedule count, or stored count
  const storedCount=S.clientOverrideCounts?.[cid]||permBlocks.length||1;
  const blockCount=parseInt(document.getElementById('tod-block-count')?.value||storedCount);

  // Block count selector
  const countSel=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">

  </div>`;

  // Build rows for blockCount blocks

    const permBlk=permBlocks[idx]; // may be undefined if adding extra blocks

    return`<div style="margin-bottom:10px;padding:8px;background:${ov?'#FFF8EC':'#f9f9f9'};border-radius:6px;border:1px solid ${ov?'#EF9F27':'#e0e0e0'};">
      <div style="font-size:11px;font-weight:600;color:#444;margin-bottom:5px;">Block ${idx+1}${permBlk?`: ${permLabel}`:''}${ov?` <span style="color:#b87a00;">→ ${ov.from} – ${ov.to} today</span>`:''}</div>
      <div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;">
        <select id="tod-from-${idx}" style="flex:1;min-width:70px;font-size:10px;padding:3px 4px;border-radius:4px;border:1px solid #ccc;">
          <option value="">From...</option>${TIMES.map(t=>`<option value="${t}"${ov&&ov.from===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <span style="font-size:10px;color:#888;">–</span>
        <select id="tod-to-${idx}" style="flex:1;min-width:70px;font-size:10px;padding:3px 4px;border-radius:4px;border:1px solid #ccc;">
          <option value="">To...</option>${TIMES.map(t=>`<option value="${t}"${ov&&ov.to===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <button style="font-size:10px;padding:3px 7px;border-radius:4px;background:#EF9F27;color:#fff;border:none;cursor:pointer;" onclick="applyBlockOverride('${cid}',${idx})">Set</button>

      </div>
    </div>`;
  }).join('');

  // Clear all button if any overrides exist
  const clearAll=ovList.length?`<button style="font-size:10px;padding:3px 8px;border-radius:4px;background:#fff;color:#D85A30;border:1px solid #D85A30;cursor:pointer;margin-top:4px;" onclick="clearClientOverride('${cid}');renderTodayOverrideBlocks();">✕ Clear all overrides</button>`:'';

function addCED(){const name=prompt('New client name:');if(!name?.trim())return;const id='c'+Date.now();S.clients.push({id,name:name.trim(),schedule:{}});S.pods[id]=[];S.edSelClient=id;markDirty();render();}
function addS(){const name=prompt('New staff name:');if(!name?.trim())return;const id='s'+Date.now();S.staff.push({id,name:name.trim(),availability:{}});S.selDaysS[id]=new Set();S.selStaff=id;markDirty();render();}
function rmC(id){if(!confirm('Remove this client?'))return;S.clients=S.clients.filter(c=>c.id!==id);delete S.pods[id];S.tempBlocks=S.tempBlocks.filter(t=>t.cid!==id);S.selClient=S.clients[0]?.id||null;markDirty();render();}
function rmS(id){if(!confirm('Remove this staff member?'))return;S.staff=S.staff.filter(s=>s.id!==id);Object.keys(S.pods).forEach(cid=>{S.pods[cid]=S.pods[cid].filter(s=>s!==id);});S.clients.forEach(c=>{DAYS.forEach(d=>{(c.schedule[d]||[]).forEach(blk=>{if(blk.staffId===id)blk.staffId=null;});});});S.calledOut=S.calledOut.filter(s=>s!==id);S.tempBlocks.forEach(tb=>{if(tb.staffId===id)tb.staffId=null;});delete S.selDaysS[id];S.selStaff=S.staff[0]?.id||null;markDirty();render();}
function ldSt(){tryLoad().then(()=>showToast('Reloaded from cloud',false));}

const AI_SK='podscheduler_ai_key';
function loadAIKey(){try{const k=localStorage.getItem(AI_SK);if(k)S.aiKey=k;}catch(e){}}
function saveAIKey(k){try{localStorage.setItem(AI_SK,k);}catch(e){}}
function buildScheduleContext(){const lines=[];lines.push('=== TODAY IS '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()]+' ===');lines.push('\n=== CLIENTS & SCHEDULES ===');S.clients.forEach(c=>{lines.push('\nClient: '+c.name);const pod=(S.pods[c.id]||[]).map(sid=>gsN(sid)?.name||sid).join(', ');lines.push('  Pod ('+(S.pods[c.id]||[]).length+' staff): '+pod);const days=Object.keys(c.schedule||{});if(!days.length){lines.push('  No schedule set');return;}days.forEach(d=>{(c.schedule[d]||[]).forEach(blk=>{const sname=blk.staffId?gsN(blk.staffId)?.name:'UNASSIGNED';lines.push('  '+d+': '+blk.from+' \u2013 '+blk.to+' \u2192 '+sname);});});});lines.push('\n=== STAFF & AVAILABILITY ===');S.staff.forEach(s=>{const out=isStaffOut(s.id);const pods=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(s.id)).map(([cid])=>gcN(cid)?.name||cid).join(', ');lines.push('\nStaff: '+s.name+(out?' [CALLED OUT TODAY]':''));lines.push('  Clients: '+(pods||'none'));const avDays=Object.keys(s.availability||{}).filter(d=>s.availability[d].length>0);avDays.forEach(d=>{const sl=s.availability[d];const from=sl[0],to=availEnd(sl);lines.push('  Available '+d+': '+from+' \u2013 '+to);});});if((S.tempBlocks||[]).length){lines.push('\n=== TEMP BLOCKS ===');S.tempBlocks.forEach(tb=>{const sname=tb.staffId?gsN(tb.staffId)?.name:'UNASSIGNED';lines.push('  '+gcN(tb.cid)?.name+' | '+tb.day+' '+tb.from+'\u2013'+tb.to+' | '+sname+(tb.label?' ('+tb.label+')':''));});}if(S.calledOut.length){lines.push('\n=== CALLED OUT TODAY ===');lines.push(S.calledOut.map(sid=>gsN(sid)?.name||sid).join(', '));}return lines.join('\n');}
async function sendAIMessage(){const inp=document.getElementById('ai-inp');if(!inp)return;const text=inp.value.trim();if(!text)return;if(!S.aiKey){showToast('Enter your API key first',true);return;}inp.value='';inp.style.height='44px';S.aiMessages.push({role:'user',content:text});S.aiLoading=true;render();setTimeout(()=>{const msgs=document.getElementById('ai-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},50);try{const systemPrompt=`You are a scheduling assistant for a care/support services organization. You have full access to the current schedule data below. Help the user manage their schedule, suggest coverage solutions, identify conflicts or gaps, and answer questions about staff and client assignments. Be concise and practical. When suggesting changes, be specific (name the staff member, client, day, and time). Format lists clearly.\n\nCURRENT SCHEDULE DATA:\n${buildScheduleContext()}`;const messages=S.aiMessages.map(m=>({role:m.role,content:m.content}));const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-ipc':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages})});const data=await res.json();if(data.error){throw new Error(data.error.message||'API error');}const reply=data.content?.[0]?.text||'No response';S.aiMessages.push({role:'assistant',content:reply});}catch(e){S.aiMessages.push({role:'error',content:'Error: '+e.message+'. Check your API key and try again.'});}S.aiLoading=false;render();setTimeout(()=>{const msgs=document.getElementById('ai-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},50);}
function askSuggestion(text){const inp=document.getElementById('ai-inp');if(inp){inp.value=text;}sendAIMessage();}
function rAI(){loadAIKey();const keySet=!!S.aiKey;const suggestions=['Who is overloaded this week?','Which clients have the weakest pod coverage?','Are there any scheduling conflicts I should know about?','Suggest how to balance the workload more evenly','Who can cover if someone calls out today?'];const msgsHtml=S.aiMessages.map(m=>{const cls=m.role==='error'?'error':m.role;return`<div class="ai-msg ${cls}">${m.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;}).join('');const typingHtml=S.aiLoading?`<div class="ai-msg assistant"><div class="ai-typing"><span></span><span></span><span></span></div></div>`:'';return`<div class="ai-wrap">${!keySet?`<div class="ai-key-wrap"><div style="font-size:13px;font-weight:500;margin-bottom:.5rem">Enter your Anthropic API key to enable AI</div><div style="font-size:11px;color:#666;margin-bottom:.75rem">Your key is stored only in this browser and only sent to Anthropic when you ask a question. Get a key at <strong>console.anthropic.com</strong>.</div><div style="display:flex;gap:8px"><input type="password" id="ai-key-inp" placeholder="sk-ant-..." style="flex:1;font-family:monospace;font-size:12px"><button class="btn btn-p" onclick="const k=document.getElementById('ai-key-inp').value.trim();if(k){S.aiKey=k;saveAIKey(k);render();}else{showToast('Paste your API key first',true);}">Save key</button></div></div>`:`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem"><div style="font-size:12px;color:#1D9E75;font-weight:500">&#x2713; API key set</div><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="S.aiMessages=[];render()">Clear chat</button><button class="btn btn-sm btn-d" onclick="S.aiKey='';try{localStorage.removeItem('${AI_SK}');}catch(e){}render()">Remove key</button></div></div>`}${S.aiMessages.length===0&&keySet?`<div><div style="font-size:12px;font-weight:500;color:#888;margin-bottom:.5rem">Suggested questions</div><div class="ai-suggestions">${suggestions.map(s=>`<button class="ai-sug" onclick="askSuggestion('${s}')">${s}</button>`).join('')}</div></div>`:''}  <div class="ai-messages" id="ai-msgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding-bottom:.5rem">${S.aiMessages.length===0&&keySet?`<div class="ai-msg system">Ask me anything about your schedule. I can see all your clients, staff, pods, and current assignments.</div>`:''} ${msgsHtml}${typingHtml}</div>${keySet?`<div class="ai-input-row"><textarea id="ai-inp" placeholder="Ask about your schedule... e.g. &quot;Alex called out Monday \u2014 who can cover?&quot;" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAIMessage();}" oninput="this.style.height='44px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea><button class="ai-send" onclick="sendAIMessage()" ${S.aiLoading?'disabled':''}>Send</button></div>`:''}</div>`;}

function rReports(){
  const log=S.eventLog||[];
  // Collect all unique year-months from log, plus current month
  const now=new Date();
  const curYM=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const months=new Set([curYM]);
  log.forEach(e=>{if(e.date)months.add(e.date.slice(0,7));});
  const monthList=[...months].sort().reverse();
  if(!S.reportMonth||!months.has(S.reportMonth))S.reportMonth=curYM;
  const sel=S.reportMonth;
  const entries=log.filter(e=>e.date&&e.date.startsWith(sel));

  // Client cancellations
  const clientMap={};
  entries.filter(e=>e.type==='client-cancel').forEach(e=>{
    if(!clientMap[e.id])clientMap[e.id]={name:e.name,clientInit:0,clinicInit:0,unknown:0};
    if(e.subtype==='client-initiated')clientMap[e.id].clientInit++;
    else if(e.subtype==='clinic-initiated')clientMap[e.id].clinicInit++;
    else clientMap[e.id].unknown++;
  });

  // Staff callouts
  const staffMap={};
  entries.filter(e=>e.type==='staff-callout').forEach(e=>{
    if(!staffMap[e.id])staffMap[e.id]={name:e.name,count:0};
    staffMap[e.id].count++;
  });

  const fmtMonth=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});};

  const monthOpts=monthList.map(m=>`<option value="${m}"${m===sel?'selected':''}>${fmtMonth(m)}</option>`).join('');

  const clientRows=Object.values(clientMap).sort((a,b)=>(b.clientInit+b.clinicInit+b.unknown)-(a.clientInit+a.clinicInit+a.unknown));
  const staffRows=Object.values(staffMap).sort((a,b)=>b.count-a.count);

  const clientTable=clientRows.length===0
    ?'<div style="font-size:12px;color:#999;padding:12px 0;">No client cancellations logged this month.</div>'
    :`<table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:2px solid #eee;">
        <th style="text-align:left;padding:8px 10px;font-weight:600;color:#444;">Client</th>
        <th style="text-align:center;padding:8px 10px;font-weight:600;color:#3C3489;">Client Called Out</th>
        <th style="text-align:center;padding:8px 10px;font-weight:600;color:#993C1D;">Clinic Cancelled</th>
        <th style="text-align:center;padding:8px 10px;font-weight:600;color:#888;">Total</th>
      </tr></thead>
      <tbody>${clientRows.map((r,i)=>`<tr style="border-bottom:1px solid #f0f0f0;background:${i%2?'#fafafa':'#fff'}">
        <td style="padding:9px 10px;font-weight:600;">${r.name}</td>
        <td style="text-align:center;padding:9px 10px;">
          ${r.clientInit>0?`<span style="background:#EEEDFE;color:#3C3489;padding:2px 10px;border-radius:12px;font-weight:700;">${r.clientInit}</span>`:'<span style="color:#ccc;">0</span>'}
        </td>
        <td style="text-align:center;padding:9px 10px;">
          ${r.clinicInit>0?`<span style="background:#FFF3F0;color:#993C1D;padding:2px 10px;border-radius:12px;font-weight:700;">${r.clinicInit}</span>`:'<span style="color:#ccc;">0</span>'}
        </td>
        <td style="text-align:center;padding:9px 10px;font-weight:700;color:#222;">${r.clientInit+r.clinicInit+r.unknown}</td>
      </tr>`).join('')}</tbody>
    </table>`;

  const staffTable=staffRows.length===0
    ?'<div style="font-size:12px;color:#999;padding:12px 0;">No staff callouts logged this month.</div>'
    :`<table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:2px solid #eee;">
        <th style="text-align:left;padding:8px 10px;font-weight:600;color:#444;">Staff Member</th>
        <th style="text-align:center;padding:8px 10px;font-weight:600;color:#993C1D;">Times Called Out</th>
      </tr></thead>
      <tbody>${staffRows.map((r,i)=>`<tr style="border-bottom:1px solid #f0f0f0;background:${i%2?'#fafafa':'#fff'}">
        <td style="padding:9px 10px;font-weight:600;">${r.name}</td>
        <td style="text-align:center;padding:9px 10px;">
          <span style="background:#FFF3EE;color:#993C1D;padding:2px 10px;border-radius:12px;font-weight:700;">${r.count}</span>
        </td>
      </tr>`).join('')}</tbody>
    </table>`;

  // Summary counts
  const totalClientCancel=entries.filter(e=>e.type==='client-cancel').length;
  const totalStaffOut=entries.filter(e=>e.type==='staff-callout').length;

  return`<div style="padding:1.5rem;max-width:860px;margin:0 auto;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;">
      <div style="font-size:1.2rem;font-weight:700;color:#222;">📊 Monthly Reports</div>
      <select onchange="S.reportMonth=this.value;render()" style="padding:6px 12px;border-radius:8px;border:1.5px solid #ddd;font-size:13px;cursor:pointer;">${monthOpts}</select>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;">
      <div style="background:#EEEDFE;border-radius:12px;padding:16px 20px;text-align:center;">
        <div style="font-size:2rem;font-weight:800;color:#3C3489;">${totalClientCancel}</div>
        <div style="font-size:12px;color:#534AB7;font-weight:600;margin-top:4px;">Client Cancellations</div>
        <div style="font-size:11px;color:#999;margin-top:2px;">${fmtMonth(sel)}</div>
      </div>
      <div style="background:#FFF3EE;border-radius:12px;padding:16px 20px;text-align:center;">
        <div style="font-size:2rem;font-weight:800;color:#993C1D;">${totalStaffOut}</div>
        <div style="font-size:12px;color:#C0532A;font-weight:600;margin-top:4px;">Staff Callouts</div>
        <div style="font-size:11px;color:#999;margin-top:2px;">${fmtMonth(sel)}</div>
      </div>
    </div>

    <div style="background:#fff;border:1.5px solid #eee;border-radius:12px;padding:20px;margin-bottom:1.25rem;">
      <div style="font-weight:700;font-size:14px;color:#222;margin-bottom:12px;">📵 Client Cancellations</div>
      <div style="font-size:11px;color:#888;margin-bottom:10px;">
        <span style="background:#EEEDFE;color:#3C3489;padding:1px 8px;border-radius:8px;margin-right:6px;">Client Called Out</span> = client or family initiated &nbsp;
        <span style="background:#FFF3F0;color:#993C1D;padding:1px 8px;border-radius:8px;">Clinic Cancelled</span> = we cancelled on them
      </div>
      ${clientTable}
    </div>

    <div style="background:#fff;border:1.5px solid #eee;border-radius:12px;padding:20px;margin-bottom:1.25rem;">
      <div style="font-weight:700;font-size:14px;color:#222;margin-bottom:12px;">🤒 Staff Callouts</div>
      ${staffTable}
    </div>

    ${log.length===0?'<div style="font-size:12px;color:#bbb;text-align:center;padding:1rem;">Events will appear here as you log callouts and cancellations going forward.</div>':''}

    <div style="text-align:right;margin-top:8px;">
      <button class="btn btn-sm" onclick="if(confirm('Clear ALL report history? This cannot be undone.')){S.eventLog=[];markDirty();render();showToast('Report history cleared',false);}">🗑 Clear History</button>
    </div>
  </div>`;
}

function render(){const mc=document.getElementById('mc');if(!mc)return;const block=['pods','data','save','ai','reports'];mc.style.display=block.includes(S.tab)?'block':'flex';window._BM={};if(S.tab==='today'){mc.innerHTML=rToday();const mp=document.getElementById('changes-panel-mount');if(mp&&window._changesPanelHTML)mp.innerHTML=window._changesPanelHTML;}else if(S.tab==='week')mc.innerHTML=rWeek();else if(S.tab==='clients')mc.innerHTML=rClients();else if(S.tab==='staff')mc.innerHTML=rStaff();else if(S.tab==='pods')mc.innerHTML=rPods();else if(S.tab==='callout')mc.innerHTML=rCallout();else if(S.tab==='data')mc.innerHTML=rData();else if(S.tab==='save')mc.innerHTML=rSave();else if(S.tab==='reports')mc.innerHTML=rReports();else if(S.tab==='ai')mc.innerHTML=rAI();updSI();}

tryLoad(); // async — loads from localStorage instantly, then syncs from cloud
</script>
