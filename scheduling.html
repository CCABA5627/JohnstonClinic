<body>
<div class="app">
  <div class="nav">
    <span class="nav-brand">CCABA Scheduling</span>
    <div class="nav-tab active" data-tab="today" onclick="go('today')">Today</div>
    <div class="nav-tab" data-tab="week" onclick="go('week')">Weekly</div>
    <div class="nav-tab" data-tab="clients" onclick="go('clients')">Clients</div>
    <div class="nav-tab" data-tab="staff" onclick="go('staff')">Staff</div>
    <div class="nav-tab" data-tab="pods" onclick="go('pods')">Pods</div>
    <div class="nav-tab" data-tab="callout" onclick="go('callout')">Callout</div>
    <div class="nav-tab" data-tab="data" onclick="go('data')">Edit Data</div>
    <div class="nav-tab" data-tab="save" onclick="go('save')">Save/Load</div>
    <div class="nav-tab" data-tab="reports" onclick="go('reports')">📊 Reports</div>
    <div class="nav-tab" data-tab="ai" onclick="go('ai')">&#x1F916; AI Assistant</div>
    <div class="nav-right">
      <span class="push-status" id="push-status"></span>
      <button class="push-btn" id="push-btn" onclick="pushToPortal()">&#x1F4E4; Push to Staff Portal</button>
      <span class="si" id="si">Not saved</span>
      <button class="btn btn-g btn-sm" onclick="doSave()" style="font-size:11px;padding:4px 12px">Save now</button>
    </div>
  </div>

</div>

<div class="modal-overlay hidden" id="assign-modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span id="modal-title-text">Assign staff</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>

</div>

      <span>&#x2B; Add temporary block</span>

<div class="toast" id="toast"></div>
<script>
// ===================== SUPABASE =====================
const SUPABASE_URL = 'https://ziyuuprfoozzlcdtxhlt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeXV1cHJmb296emxjZHR4aGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNTk3NDEsImV4cCI6MjA5NzczNTc0MX0.26hwhypq0elib35SFGa7ErLmgmAtpIoOnUIZ6_eALQ0';

async function pushToPortal() {
  const btn = document.getElementById('push-btn');
  const status = document.getElementById('push-status');
  btn.disabled = true;
  btn.textContent = 'Pushing...';
  status.textContent = '';
  try {
    const today = new Date().toISOString().split('T')[0];
    const todayDay = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
    const rows = [];

    S.clients.forEach(c => {
      if(S.calledOutClients.includes(c.id)) return;
      (c.schedule[todayDay] || []).forEach(blk => {
        if(blk.splits && blk.splits.length) {
          blk.splits.forEach(sp => {
            if(isStaffOut(sp.sid)) return;
            const staffMember = gsN(sp.sid);
            if(!staffMember) return;
            rows.push({ staff: staffMember.name, client: c.name, time: sp.from + ' \u2013 ' + sp.to, location: 'Center', date: today });
          });
        } else {
          if(!blk.staffId) return;
          const staffMember = gsN(blk.staffId);
          if(!staffMember || isStaffOut(blk.staffId)) return;
          rows.push({ staff: staffMember.name, client: c.name, time: blk.from + ' \u2013 ' + blk.to, location: 'Center', date: today });
        }
      });
    });

    // Temp blocks — include even for cancelled clients (they're replacement sessions)
    (S.tempBlocks || []).filter(tb => tb.day === todayDay && tb.staffId).forEach(tb => {
      if(isStaffOut(tb.staffId)) return;
      const staffMember = gsN(tb.staffId);
      const client = gcN(tb.cid);
      if(!staffMember || !client) return;
      rows.push({ staff: staffMember.name, client: client.name, time: tb.from + ' \u2013 ' + tb.to, location: 'Center', date: today });
    });

    await fetch(`${SUPABASE_URL}/rest/v1/assignments?date=eq.${today}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    if (rows.length > 0) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/assignments`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(rows)
      });
      if (!res.ok) throw new Error('Insert failed: ' + res.status);
    }

    // Also push staff schedules
    await pushStaffSchedules();

    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    status.textContent = '\u2713 Pushed ' + rows.length + ' assignments at ' + time;
    status.style.color = '#1D9E75';
    showToast('\u2713 ' + rows.length + ' assignments pushed to Staff Portal!', false);
  } catch(e) {
    status.textContent = '\u26a0 Push failed \u2014 check connection';
    status.style.color = '#D85A30';
    showToast('Push failed: ' + e.message, true);
  }
  btn.disabled = false;
  btn.innerHTML = '&#x1F4E4; Push to Staff Portal';
}

async function pushStaffSchedules() {
  const sessionRows = [];
  const availRows = [];

  S.staff.forEach(s => {
    DAYS.forEach(d => {
      // Push each individual assigned session block — use getEffectiveBlocks so
      // any today-set staff overrides (even for future days) are included
      S.clients.forEach(c => {
        getEffectiveBlocks(c.id, d).forEach(blk => {
          if(blk.splits && blk.splits.length) {
            blk.splits.forEach(sp => {
              if(sp.sid === s.id)
                sessionRows.push({ staff_name: s.name, day: d, start_time: sp.from, end_time: sp.to, client_name: c.name });
            });
          } else if(blk.staffId === s.id) {
            sessionRows.push({ staff_name: s.name, day: d, start_time: blk.from, end_time: blk.to, client_name: c.name });
          }
        });
      });

      // Push availability window for this day
      const avSlots = s.availability[d] || [];
      if(avSlots.length) {
        const avStart = avSlots[0];
        const lastIdx = avSlots.length - 1;
        const lastSlot = avSlots[lastIdx];
        const lastSlotIdx = TIMES.indexOf(lastSlot);
        const avEnd = TIMES[lastSlotIdx + 1] || lastSlot;
        availRows.push({ staff_name: s.name, day: d, start_time: avStart, end_time: avEnd });
      }
    });
  });

  // Replace staff_schedules (sessions)
  await fetch(`${SUPABASE_URL}/rest/v1/staff_schedules?staff_name=neq.null`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
  });
  if(sessionRows.length > 0) {
    await fetch(`${SUPABASE_URL}/rest/v1/staff_schedules`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(sessionRows)
    });
  }

  // Replace staff_availability

function todayISO(){return new Date().toISOString().slice(0,10);}
function getEffectiveBlocks(cid, day){
  const c=gcN(cid); if(!c) return [];
  const blocks=c.schedule[day]||[];
  const iso=todayISO();
  // Time overrides (today-only schedule adjustments)
  const rawOvList=S.clientOverrides[cid];
  const ovList=Array.isArray(rawOvList)?rawOvList:[];
  const activeOvs=ovList.filter(o=>o.date?o.date===iso&&o.day===day:o.day===day);
  // Staff overrides (today-only substitutions assigned through callout coverage)
  const rawStOvList=S.staffOverrides[cid];
  const stOvList=Array.isArray(rawStOvList)?rawStOvList:[];
  const activeStOvs=stOvList.filter(o=>o.date===iso&&o.day===day);
  const todayCount=(S.clientOverrideCounts?.[cid])||blocks.length;
  const count=Math.max(blocks.length,activeOvs.length>0?todayCount:blocks.length);
  return Array.from({length:count},(_,idx)=>{
    const blk=blocks[idx]||{from:'',to:'',staffId:null,splits:null};
    const ov=activeOvs.find(o=>o.blockIdx===idx);

      slotsInBlock(sp.from,sp.to).forEach(sl=>{if(blockSlots.includes(sl)&&!calledOutM.has(t2m(sl)))coveredSlots.add(sl);});
    });
    const uncoveredSlots=blockSlots.filter(sl=>!coveredSlots.has(sl));
    const uncoveredDesc=uncoveredSlots.length
      ?`<div style="font-size:11px;color:#b87a00;font-weight:600;margin-top:6px;">⏱ Still uncovered: ${uncoveredSlots.length*15}m (${uncoveredSlots[0]} – ${slotEndDisplay(uncoveredSlots[uncoveredSlots.length-1],blockTo)})</div>`
      :'<div style="font-size:11px;color:#1D9E75;font-weight:600;margin-top:6px;">✅ Fully covered!</div>';
    currentCoverageHtml=`<div style="background:#E1F5EE;border:1px solid #5DCAA5;border-radius:8px;padding:10px 12px;margin-bottom:10px;">
      <div style="font-size:11px;font-weight:700;color:#085041;margin-bottom:6px;">Current coverage</div>
      ${splits.map(sp=>{
        const spCOs=getStaffCallout(sp.sid);
        const partialOut=spCOs.filter(co=>co.fromM!==undefined);
        const coNote=partialOut.length?`<span style="font-size:10px;color:#b87a00;margin-left:4px;">(out ${partialOut.map(co=>coLabel(co)).join(', ')})</span>`:'';
        return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(gsN(sp.sid)?.name||'?')}</div>
          <span style="font-size:12px;font-weight:500;flex:1">${gsN(sp.sid)?.name}${coNote}</span>
          <span style="font-size:11px;color:#085041">${sp.from} – ${sp.to}</span>
          <button onclick="removeSplit('${cid}','${day}',${isTemp?-1:blockIdx},'${sp.sid}','${tempId||''}')" style="background:none;border:none;color:#D85A30;cursor:pointer;font-size:14px;padding:0 2px;">×</button>
        </div>`;
      }).join('')}
      ${uncoveredDesc}
      <button class="unassign-btn" style="margin-top:8px;" onclick="clearAllSplits('${cid}','${day}',${isTemp?-1:blockIdx},'${tempId||''}')">Clear all assignments</button>
    </div>`;
  }

  // Remove assignment button at TOP so it's always visible regardless of list length
  let removeBtn='';
  if(currentSid||isTemp){
    removeBtn=`<button class="unassign-btn" style="margin-bottom:8px;" onclick="doAssign('${cid}','${day}',${isTemp?-1:blockIdx},null,'${tempId||''}')">✕ Remove assignment</button>`;
  }
  if(isTemp){
    removeBtn+=`<button class="unassign-btn" style="color:#534AB7;border-color:#534AB7;margin-bottom:8px;margin-top:${currentSid?'4':'0'}px;" onclick="deleteTempBlock('${tempId}')">🗑 Delete this temp block</button>`;
  }
  let html=currentCoverageHtml+removeBtn;

  // 1. Pod — full block
  if(podFull.length){
    html+='<div class="modal-section">✅ Pod — covers full block</div>';
    podFull.forEach(o=>{
      const cf=chkConflict(o.sid,slots,cid,isTemp?-1:blockIdx,tempId||null);
      let note='';
      if(cf.hasConflict){note=`<div style="font-size:10px;color:#D85A30;margin-top:2px;font-weight:500">⚠ Conflict with: ${cf.conflicts.map(x=>x.name+' '+x.from+'-'+x.to).join(', ')}</div>`;}
      html+=staffRow(o.sid,'',o.sid===currentSid,cf.hasConflict,note);
    });
  }

  // 2. Pod — partial (≥1hr)
  if(podPartial.length){
    html+='<div class="modal-section">🕐 Pod — partially available</div>';
    podPartial.forEach(o=>{
      const contrib=getContribSlots(o.sid);
      if(!contrib.length)return;
      const alreadyAdded=splits&&splits.some(sp=>sp.sid===o.sid);
      const desc=alreadyAdded?'✓ Already added':descContrib(contrib)||'Partial';
      const note=alreadyAdded
        ?`<div style="font-size:10px;color:#1D9E75;margin-top:2px;font-weight:600">Already in coverage</div>`
        :`<div style="font-size:10px;color:#EF9F27;margin-top:2px">Doesn't cover full block</div>`;
      html+=staffRow(o.sid,desc,alreadyAdded,false,note,null,'partial');
    });
  }

  // 3. Pod — not available
  if(podNone.length){
    html+='<div class="modal-section">❌ Pod — not available</div>';
    podNone.forEach(o=>{const s=gsN(o.sid);html+=`<div class="staff-opt unavail"><div class="av av-s" style="width:28px;height:28px;font-size:10px">${ini(s.name)}</div><div><div class="staff-opt-name">${s.name}</div><div class="staff-opt-sub">No availability during this time</div></div></div>`;});
  }

  // 4. Non-pod — full, no conflict
  if(npFull.length){
    html+=`<div class="modal-section" style="margin-top:10px;">🔓 Not in pod — free for full block</div>`;
    html+=`<div style="font-size:10px;color:#888;margin-bottom:6px;padding:4px 8px;background:#FFF8EC;border-radius:6px;border:1px solid #FAC775;">Available with no conflicts. Go to Pods tab to add permanently.</div>`;
    npFull.forEach(o=>{
      const note='';
      html+=staffRow(o.sid,'Available — no conflicts',o.sid===currentSid,false,note,null,null);
    });
  }

  // 5. Non-pod — partial (≥1hr), no conflict
  if(npPartial.length){
    html+=`<div class="modal-section">🕐 Not in pod — partially free</div>`;
    html+=`<div style="font-size:10px;color:#888;margin-bottom:6px;padding:4px 8px;background:#FFF8EC;border-radius:6px;border:1px solid #FAC775;">Available for part of this block with no conflicts.</div>`;
    npPartial.forEach(o=>{
      const contrib=getContribSlots(o.sid);
      if(!contrib.length)return;
      const alreadyAdded=splits&&splits.some(sp=>sp.sid===o.sid);
      const desc=alreadyAdded?'✓ Already added':descContrib(contrib)||'Partial';
      const note=alreadyAdded
        ?`<div style="font-size:10px;color:#1D9E75;margin-top:2px;font-weight:600">Already in coverage</div>`
        :`<div style="font-size:10px;color:#EF9F27;margin-top:2px">Doesn't cover full block</div>`;
      html+=staffRow(o.sid,desc,alreadyAdded,false,note,null,'partial');
    });
  }

  if(!html)html='<div style="font-size:12px;color:#888;padding:.5rem 0">No staff available during this time.</div>';
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('assign-modal').classList.remove('hidden');
}

// Get the block object (regular or temp)
function getBlk(cid,day,blockIdx,tempId){
  if(tempId)return S.tempBlocks.find(t=>t.id===tempId)||null;
  return (gcN(cid)?.schedule[day]||[])[blockIdx]||null;
}

// Add or replace a staff member's coverage on a block for specific slots
function doAssign(cid,day,blockIdx,newSid,tempId){
  if(tempId){
    // Temp blocks are already today-only — safe to write directly
    const blk=getBlk(cid,day,blockIdx,tempId);
    if(!blk)return;
    blk.staffId=newSid||null;blk.splits=null;
  } else {
    // Regular block — store as a today-only staff override, never touch c.schedule
    const iso=todayISO();
    if(!S.staffOverrides[cid])S.staffOverrides[cid]=[];
    S.staffOverrides[cid]=S.staffOverrides[cid].filter(o=>!(o.day===day&&o.blockIdx===blockIdx&&o.date===iso));
    if(newSid) S.staffOverrides[cid].push({day,blockIdx,staffId:newSid,date:iso});
    const permStaff=gcN(cid)?.schedule[day]?.[blockIdx]?.staffId;
    const subName=gsN(newSid)?.name;const permName=gsN(permStaff)?.name;
    showToast((subName||'Staff')+' assigned for today only'+(permName?' (normally: '+permName+')':''),false);
  }
  markDirty();closeModal();render();
}

// Assign a staff member to cover only the uncovered slots they're available for
function doAssignPartial(cid,day,blockIdx,newSid,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  const blockSlots=blk.slots||slotsInBlock(blk.from,blk.to);
  // Find already covered slots from existing splits
  const coveredSlots=new Set();
  if(blk.splits){
    blk.splits.filter(sp=>sp.sid!==newSid).forEach(sp=>
      slotsInBlock(sp.from,sp.to).forEach(sl=>{if(blockSlots.includes(sl))coveredSlots.add(sl);})
    );
  } else if(blk.staffId&&blk.staffId!==newSid){
    const pav=new Set(gsN(blk.staffId)?.availability[day]||[]);
    blockSlots.forEach(sl=>{if(pav.has(sl))coveredSlots.add(sl);});
  }
  // Staff covers the uncovered slots they're available for
  const staffAvail=new Set(gsN(newSid)?.availability[day]||[]);
  const remaining=blockSlots.filter(sl=>!coveredSlots.has(sl));
  const coverSlots=(remaining.length?remaining:blockSlots).filter(sl=>staffAvail.has(sl));
  if(!coverSlots.length)return;
  // Convert to time range
  const from=coverSlots[0];
  const lastIdx=TIMES.indexOf(coverSlots[coverSlots.length-1]);
  const to=TIMES[lastIdx+1]||blk.to;
  // Build splits
  if(!blk.splits){
    // First split: existing staff covers their portion, new staff covers theirs
    blk.splits=[];
    if(blk.staffId){
      const existAv=new Set(gsN(blk.staffId)?.availability[day]||[]);
      const existSlots=blockSlots.filter(sl=>existAv.has(sl));
      if(existSlots.length){
        const ef=existSlots[0];
        const elIdx=TIMES.indexOf(existSlots[existSlots.length-1]);
        const et=TIMES[elIdx+1]||blk.to;
        blk.splits.push({sid:blk.staffId,from:ef,to:et});
      }
    }
  }
  // Remove existing entry for this staff, add updated one
  blk.splits=blk.splits.filter(sp=>sp.sid!==newSid);
  blk.splits.push({sid:newSid,from,to});
  blk.splits.sort((a,b)=>t2m(a.from)-t2m(b.from));
  blk.staffId=blk.splits[0].sid;
  markDirty();
  openAssignModal(cid,day,blockIdx,!!tempId,tempId);
  render();
}

function removeSplit(cid,day,blockIdx,sid,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  if(blk.splits){blk.splits=blk.splits.filter(sp=>sp.sid!==sid);if(!blk.splits.length)blk.splits=null;}
  blk.staffId=blk.splits?.[0]?.sid||null;
  markDirty();
  renderAssignModalBody(cid,day,blockIdx,tempId,blk);
  render();
}

function clearAllSplits(cid,day,blockIdx,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  blk.staffId=null;blk.splits=null;
  markDirty();closeModal();render();
}

function syncTbEnd(){const ss=document.getElementById('tb-start'),es=document.getElementById('tb-end');if(!ss||!es)return;const tgt=t2m(ss.value)+60;let best=TIMES[TIMES.length-1];TIMES.forEach(t=>{if(t2m(t)<=tgt)best=t;});es.value=best;}
function createTempBlock(){const cid=document.getElementById('tb-client').value;const day=document.getElementById('tb-day').value;const from=document.getElementById('tb-start').value;const to=document.getElementById('tb-end').value;const label=document.getElementById('tb-label').value.trim()||'Temp block';if(t2m(to)<=t2m(from)){showToast('Finish must be after start',true);return;}const slots=slotsInBlock(from,to);const id='tb'+Date.now();const pod=S.pods[cid]||[];let bestSid=null,bestScore=-1;pod.forEach(sid=>{if(isStaffOutAt(sid,slots[0]))return;const s=gsN(sid);if(!s)return;const av=new Set(s.availability[day]||[]);if(!slots.every(sl=>av.has(sl)))return;const sc=overlap(sid,cid);if(sc>bestScore){bestScore=sc;bestSid=sid;}});S.tempBlocks.push({id,cid,day,slots,from,to,staffId:bestSid,label});markDirty();closeTempModal();render();showToast(bestSid?`Block created \u2014 assigned to ${gsN(bestSid)?.name}`:'Block created \u2014 tap it to assign staff',false);}

function addBlock(cid,day){const c=gcN(cid);if(!c)return;if(!c.schedule[day])c.schedule[day]=[];const existing=c.schedule[day];let defFrom='9:00 AM';if(existing.length){const last=existing[existing.length-1];const idx=TIMES.indexOf(last.to);defFrom=TIMES[Math.min(idx+1,TIMES.length-1)]||last.to;}const defToIdx=Math.min(TIMES.indexOf(defFrom)+4,TIMES.length-1);const defTo=TIMES[defToIdx]||defFrom;existing.push({from:defFrom,to:defTo,staffId:null});markDirty();render();}
function deleteBlock(cid,day,idx){const c=gcN(cid);if(!c)return;(c.schedule[day]||[]).splice(idx,1);if(!(c.schedule[day]||[]).length)delete c.schedule[day];markDirty();render();}
function updateBlockFrom(cid,day,idx,val){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.from=val;if(t2m(blk.to)<=t2m(val)){const ti=TIMES.indexOf(val);blk.to=TIMES[Math.min(ti+4,TIMES.length-1)]||val;}markDirty();render();}
function updateBlockTo(cid,day,idx,val){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.to=val;markDirty();render();}
function updateBlockStaff(cid,day,idx,sid){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.staffId=sid||null;markDirty();render();}
function toggleDay(cid,day){const c=gcN(cid);if(!c)return;if(c.schedule[day]){delete c.schedule[day];}else{c.schedule[day]=[];addBlock(cid,day);return;}markDirty();render();}

const SB_STATE_URL=`${SUPABASE_URL}/rest/v1/schedule_state`;
const SB_HDR={'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'};

function applyState(p){
  S.clients=p.clients||S.clients;
  S.staff=p.staff||S.staff;
  S.pods=p.pods||S.pods;
  S.tempBlocks=p.tempBlocks||[];
  S.calledOut=p.calledOut||[];
  S.calledOutClients=p.calledOutClients||[];
  // Migrate clientOverrides from old {cid:{day,from,to}} to new {cid:[{blockIdx,day,from,to}]}
  const rawOv = p.clientOverrides || {};
  const migratedOv = {};
  Object.entries(rawOv).forEach(([cid, val]) => {
    if (Array.isArray(val)) {
      migratedOv[cid] = val; // already new format
    } else if (val && typeof val === 'object' && val.from) {
      // old single-object format — convert to array with blockIdx 0
      migratedOv[cid] = [{ blockIdx: 0, day: val.day, from: val.from, to: val.to }];
    }
  });
  S.clientOverrideCounts=p.clientOverrideCounts||{};
  S.staffOverrides=p.staffOverrides||{};
  S.acknowledgedChanges=p.acknowledgedChanges||{};
  S.eventLog=p.eventLog||[];
  S.selClient=S.clients[0]?.id||null;
  S.selStaff=S.staff[0]?.id||null;
  S.lastSaved=p.savedAt||null;
  S.dirty=false;
  S.selDaysS=initSDS(S.staff);
  updSI();
}

async function tryLoad(){
  // First apply from localStorage instantly so UI isn't blank
  try{
    const r=localStorage.getItem(SK);
    if(r){applyState(JSON.parse(r));}
  }catch(e){}
  // Then fetch from Supabase and overwrite if newer
  try{
    updSI('loading');
    const res=await fetch(`${SB_STATE_URL}?id=eq.main`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    const rows=await res.json();
    if(Array.isArray(rows)&&rows.length&&rows[0].data){
      const p=rows[0].data;
      const cloudTime=new Date(p.savedAt||0).getTime();
      const localTime=new Date(S.lastSaved||0).getTime();
      if(cloudTime>=localTime){
        applyState(p);
        // Update local cache
        try{localStorage.setItem(SK,JSON.stringify(p));}catch(e){}
        showToast('Schedule loaded from cloud',false);
      }
    }
  }catch(e){
    console.warn('Could not load from cloud, using local data',e);
  }
  render();
  return true;
}

async function doSave(silent){
  try{
    const d={clients:S.clients,staff:S.staff,pods:S.pods,tempBlocks:S.tempBlocks,calledOut:S.calledOut,calledOutClients:S.calledOutClients,clientOverrides:S.clientOverrides,clientOverrideCounts:S.clientOverrideCounts||{},staffOverrides:S.staffOverrides||{},acknowledgedChanges:S.acknowledgedChanges||{},eventLog:S.eventLog||[],savedAt:new Date().toISOString()};
    // Save to localStorage immediately as fast cache
    try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}
    // Save to Supabase
    updSI('saving');
    await fetch(SB_STATE_URL,{method:'POST',headers:SB_HDR,body:JSON.stringify({id:'main',data:d,updated_at:new Date().toISOString()})});
    S.dirty=false;S.lastSaved=d.savedAt;updSI();
    if(!silent)showToast('Saved ✓',false);
  }catch(e){
    // Fall back to just localStorage
    try{const d={clients:S.clients,staff:S.staff,pods:S.pods,tempBlocks:S.tempBlocks,savedAt:new Date().toISOString()};localStorage.setItem(SK,JSON.stringify(d));S.dirty=false;S.lastSaved=d.savedAt;updSI();}catch(e2){}
    if(!silent)showToast('Saved locally (cloud unavailable)',false);
  }
}

function markDirty(){
  S.dirty=true;updSI();
  if(window._autoSaveTimer)clearTimeout(window._autoSaveTimer);
  window._autoSaveTimer=setTimeout(()=>{if(S.dirty){doSave(true);}},2000);
}
function updSI(status){const el=document.getElementById('si');if(!el)return;if(status==='saving'){el.className='si unsaved';el.textContent='☁ Saving...';}else if(status==='loading'){el.className='si';el.textContent='☁ Loading...';}else if(S.dirty){el.className='si unsaved';el.textContent='Unsaved changes';}else if(S.lastSaved){el.className='si saved';el.textContent='☁ Saved '+new Date(S.lastSaved).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}else{el.className='si';el.textContent='Not saved yet';}}

function exportJSON(){const d={clients:S.clients,staff:S.staff,pods:S.pods,tempBlocks:S.tempBlocks,exportedAt:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ccaba-scheduling-backup.json';a.click();URL.revokeObjectURL(u);showToast('Backup downloaded',false);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.clients||!p.staff)throw 0;S.clients=p.clients;S.staff=p.staff;S.pods=p.pods||{};S.tempBlocks=p.tempBlocks||[];S.selClient=S.clients[0]?.id||null;S.selStaff=S.staff[0]?.id||null;S.calledOut=[];S.selDaysS=initSDS(S.staff);markDirty();render();showToast('Imported — saving to cloud…',false);}catch(e){showToast('Invalid file',true);}};r.readAsText(f);};i.click();}
function resetData(){if(!confirm('Reset ALL data to sample defaults? This will clear the cloud too.'))return;const f=JSON.parse(JSON.stringify(DD));Object.assign(S,f);S.tempBlocks=[];S.selClient=S.clients[0]?.id;S.selStaff=S.staff[0]?.id;S.calledOut=[];S.calledOutClients=[];S.clientOverrides={};S.staffOverrides={};S.dirty=true;S.selDaysS=initSDS(S.staff);try{localStorage.removeItem(SK);}catch(e){}doSave(true);render();showToast('Reset to defaults',false);}

function ini(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function gcN(id){return S.clients.find(c=>c.id===id);}
function gsN(id){return S.staff.find(s=>s.id===id);}
function overlap(sid,cid){const c=gcN(cid),s=gsN(sid);if(!c||!s)return 0;let o=0;DAYS.forEach(d=>{const cs=new Set((c.schedule[d]||[]).flatMap(blk=>slotsInBlock(blk.from,blk.to)));(s.availability[d]||[]).forEach(t=>{if(cs.has(t))o++;});});return o;}
function getStaffDaySlots(sid,day){const slots=new Set();S.clients.forEach(c=>{(c.schedule[day]||[]).forEach(blk=>{if(blk.staffId===sid)slotsInBlock(blk.from,blk.to).forEach(s=>slots.add(s));});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId===sid&&tb.day===day)tb.slots.forEach(s=>slots.add(s));});return slots;}
function checkConflict(sid,day,newSlots,excludeCid,excludeBlockIdx,excludeTempId){const conflicts=[];const newSet=new Set(newSlots);S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;getEffectiveBlocks(c.id,day).forEach((blk,idx)=>{if(blk.staffId!==sid)return;if(c.id===excludeCid&&idx===excludeBlockIdx)return;const overlap=slotsInBlock(blk.from,blk.to).filter(s=>newSet.has(s));if(overlap.length>0)conflicts.push({name:c.name,from:blk.from,to:blk.to});});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId!==sid||tb.day!==day)return;if(tb.id===excludeTempId)return;if(S.calledOutClients.includes(tb.cid))return;// don't count cancelled client's temp blocks as conflicts
const overlap=tb.slots.filter(s=>newSet.has(s));if(overlap.length>0)conflicts.push({name:gcN(tb.cid)?.name||'?'+' (temp)',from:tb.from,to:tb.to});});return{hasConflict:conflicts.length>0,conflicts};}
function getConflictingStaffOnDay(day){const staffSlots={};S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;getEffectiveBlocks(c.id,day).forEach(blk=>{if(!blk.staffId)return;if(!staffSlots[blk.staffId])staffSlots[blk.staffId]=[];staffSlots[blk.staffId].push({slots:new Set(slotsInBlock(blk.from,blk.to)),from:blk.from,to:blk.to,name:c.name});});});(S.tempBlocks||[]).forEach(tb=>{if(!tb.staffId||tb.day!==day)return;if(S.calledOutClients.includes(tb.cid))return;// skip cancelled client temp blocks
if(!staffSlots[tb.staffId])staffSlots[tb.staffId]=[];staffSlots[tb.staffId].push({slots:new Set(tb.slots),from:tb.from,to:tb.to,name:(gcN(tb.cid)?.name||'?')+' (temp)'});});const conflicting=new Set();Object.entries(staffSlots).forEach(([sid,blocks])=>{for(let i=0;i<blocks.length;i++){for(let j=i+1;j<blocks.length;j++){const overlap=[...blocks[i].slots].some(s=>blocks[j].slots.has(s));if(overlap){conflicting.add(sid);break;}}}});return conflicting;}
function addPartialCallout(sid){
  const f=document.getElementById('co-partial-from');const t=document.getElementById('co-partial-to');
  if(!f?.value||!t?.value){showToast('Select both a from and to time',true);return;}
  if(t2m(f.value)>=t2m(t.value)){showToast('From must be before To',true);return;}
  S.calledOut=S.calledOut.filter(co=>co.sid!==sid||(co.fromM!==undefined&&!(t2m(f.value)<co.toM&&t2m(t.value)>co.fromM)));
  S.calledOut.push({sid,fromM:t2m(f.value),toM:t2m(t.value)});
  render();showToast(`Partial callout added: ${f.value} \u2013 ${t.value}`,false);
}
function bestForSlot(cid,day,slot,excl){const pod=S.pods[cid]||[];const res=[];pod.forEach(sid=>{if(sid===excl||isStaffOutAt(sid,slot))return;const s=gsN(sid);if(!s)return;if((s.availability[day]||[]).includes(slot))res.push({sid,score:overlap(sid,cid)});});return res.sort((a,b)=>b.score-a.score);}
function todayDay(){const d=ALL_DAYS[new Date().getDay()];return DAYS.includes(d)?d:DAYS[0];}
function go(t){S.tab=t;document.querySelectorAll('.nav-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function fmtBlock(blk){return blk.from+(blk.from!==blk.to?' \u2013 '+blk.to:'');}
function getDayBlocks(day){const out=[];S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;getEffectiveBlocks(c.id,day).forEach((blk,idx)=>{out.push({client:c,from:blk.from,to:blk.to,staffId:blk.staffId,splits:blk.splits||null,isTemp:false,blockIdx:idx,overridden:blk._overridden||false,staffOverridden:blk._staffOverridden||false,origStaffId:blk._origStaffId||null});});});(S.tempBlocks||[]).filter(tb=>tb.day===day).forEach(tb=>{const c=gcN(tb.cid);if(!c)return;// Show temp blocks even if client is cancelled — temp block IS the replacement session
out.push({client:c,from:tb.from,to:tb.to,staffId:tb.staffId,splits:tb.splits||null,isTemp:true,tempId:tb.id,label:tb.label,slots:tb.slots,clientCancelled:S.calledOutClients.includes(tb.cid)});});out.sort((a,b)=>t2m(a.from)-t2m(b.from));return out;}

function getPartialGaps(bl,day){
  // No staff at all \u2014 not a partial gap, it's fully uncovered (handled separately)
  if(!bl.staffId&&(!bl.splits||!bl.splits.length))return null;
  const blockFrom=bl.from, blockTo=bl.to;
  const allSlots=bl.isTemp?bl.slots:slotsInBlock(blockFrom,blockTo);
  if(!allSlots.length)return null;
  const allSlotsSet=new Set(allSlots);

  const coveredSlots=new Set();
  if(bl.splits&&bl.splits.length){
    // Split block \u2014 check each split staff member individually
    bl.splits.forEach(sp=>{
      if(isStaffOut(sp.sid))return; // all-day callout \u2014 covers nothing
      const spCOs=getStaffCallout(sp.sid);
      const calledOutM=new Set();
      spCOs.forEach(co=>{if(co.fromM!==undefined)for(let m=co.fromM;m<co.toM;m+=15)calledOutM.add(m);});
      slotsInBlock(sp.from,sp.to).forEach(sl=>{
        if(allSlotsSet.has(sl)&&!calledOutM.has(t2m(sl)))coveredSlots.add(sl);
      });
    });
  } else if(bl.staffId){
    // Single staff \u2014 if all-day callout, nothing is covered
    if(isStaffOut(bl.staffId))return null; // show as "called out" not partial gap
    const staffCOs=getStaffCallout(bl.staffId);
    const calledOutM=new Set();
    staffCOs.forEach(co=>{if(co.fromM!==undefined)for(let m=co.fromM;m<co.toM;m+=15)calledOutM.add(m);});
    // All slots in the block are covered unless staff is partially called out during them
    allSlots.forEach(sl=>{
      if(!calledOutM.has(t2m(sl)))coveredSlots.add(sl);
    });
  }

  const uncovered=allSlots.filter(sl=>!coveredSlots.has(sl));
  if(!uncovered.length)return null;

  function slotEnd(slotTime){
    const idx=TIMES.indexOf(slotTime);const next=TIMES[idx+1];
    return(next&&t2m(next)<=t2m(blockTo))?next:blockTo;
  }
  const ranges=[];let start=uncovered[0],prev=uncovered[0];
  for(let i=1;i<uncovered.length;i++){
    const prevIdx=TIMES.indexOf(prev),curIdx=TIMES.indexOf(uncovered[i]);
    if(curIdx===prevIdx+1){prev=uncovered[i];}
    else{ranges.push(start+' \u2013 '+slotEnd(prev));start=uncovered[i];prev=uncovered[i];}
  }
  ranges.push(start+' \u2013 '+slotEnd(prev));
  const mins=uncovered.length*15;
  const dur=mins>=60?Math.floor(mins/60)+'h'+(mins%60?' '+mins%60+'m':''):(mins+'m');
  return`${dur} uncovered: ${ranges.join(', ')}`;
}

function rToday(){
  if(!S.selectedDay)S.selectedDay=todayDay();
  if(!S.todayFilter)S.todayFilter='all';
  const today=S.selectedDay; const realToday=todayDay();
  const blocks=getDayBlocks(today);
  const todayConflicts=getConflictingStaffOnDay(today);

  // Categorize blocks
  const needsCoverage=[],conflictBlocks=[],partialBlocks=[],coveredBlocks=[],tempBlocks=[];
  blocks.forEach(bl=>{
    const staffOut=bl.staffId&&isStaffOut(bl.staffId);
    const gaps=getPartialGaps(bl,today);
    const conflict=bl.staffId&&todayConflicts.has(bl.staffId)&&!staffOut;
    if(bl.isTemp){tempBlocks.push({bl,gaps,conflict});}
    else if(!bl.staffId||staffOut){needsCoverage.push({bl,gaps,conflict});}
    else if(conflict){conflictBlocks.push({bl,gaps,conflict:true});}
    else if(gaps){partialBlocks.push({bl,gaps,conflict:false});}
    else{coveredBlocks.push({bl,gaps,conflict:false});}
  });

  function blockCard(bl,gaps,conflict){
    const staffOut=bl.staffId&&isStaffOut(bl.staffId);
    const bkey=regBlock('t_'+bl.client.id+'_'+today+'_'+bl.from.replace(/ /g,'')+(bl.isTemp?bl.tempId:bl.blockIdx),{cid:bl.client.id,day:today,blockIdx:bl.blockIdx??-1,isTemp:!!bl.isTemp,tempId:bl.tempId||null});
    let staffLine;
    if(!bl.staffId){staffLine=`<div style="color:#993C1D;font-weight:600;font-size:12px;margin-top:3px;">⚠ Unassigned — needs coverage</div>`;}
    else if(staffOut){staffLine=`<div style="color:#993C1D;font-weight:600;font-size:12px;margin-top:3px;">⚠ ${gsN(bl.staffId)?.name} called out</div>`;}
    else if(conflict){staffLine=`<div style="color:#D85A30;font-weight:600;font-size:12px;margin-top:3px;">⚠ ${gsN(bl.staffId)?.name} — double booked</div>`;}
    else if(bl.splits&&bl.splits.length>1){staffLine=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">${bl.splits.map(sp=>{const spOut=isStaffOut(sp.sid);return`<span style="font-size:11px;padding:2px 8px;border-radius:12px;background:${spOut?'#F5C4B3':'#E1F5EE'};color:${spOut?'#4A1B0C':'#085041'};font-weight:500;">${gsN(sp.sid)?.name||'?'} <span style="opacity:.7;font-size:10px;">${sp.from}–${sp.to}</span></span>`;}).join('')}</div>`;}
    else{staffLine=`<div style="font-size:13px;font-weight:600;color:#111;margin-top:3px;">${gsN(bl.staffId)?.name||'?'}</div>`;}
    const overrideTag=bl.overridden?`<div style="margin-top:4px;"><span style="font-size:10px;background:#FFF8EC;color:#b87a00;border:1px solid #EF9F27;border-radius:6px;padding:2px 7px;">📅 Today only: ${bl.from}–${bl.to}</span></div>`:'';
    const gapTag=gaps?`<div style="font-size:11px;color:#b87a00;font-weight:600;margin-top:4px;">⏱ Gap: ${gaps}</div>`:'';
    const tempTag=bl.isTemp?`<span style="font-size:10px;background:#E6F1FB;color:#0C447C;padding:2px 7px;border-radius:6px;">${bl.clientCancelled?'Replacement':'Temp'}${bl.label?' – '+bl.label:''}</span>`:'';
    const leftBorder=conflict?'4px solid #D85A30':(!bl.staffId||staffOut)?'4px solid #E24B4A':gaps?'4px solid #EF9F27':bl.isTemp?'4px solid #85B7EB':'4px solid #1D9E75';
    const bg=conflict?'#FFF5F2':(!bl.staffId||staffOut)?'#fff9f9':gaps?'#FFFDF5':bl.isTemp?'#F4F9FF':'#fff';
    return`<div onclick="openBlock('${bkey}')" style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid rgba(0,0,0,.08);margin-bottom:8px;cursor:pointer;border-left:${leftBorder};background:${bg};" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
      <div style="min-width:90px;flex-shrink:0;padding-top:2px;">
        <div style="font-size:11px;color:#555;font-weight:600;">${fmtBlock(bl)}</div>
        ${tempTag?`<div style="margin-top:4px;">${tempTag}</div>`:''}
      </div>
      <div class="av av-c" style="width:36px;height:36px;font-size:11px;flex-shrink:0;">${ini(bl.client.name)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:#111;">${bl.client.name}</div>
        ${staffLine}${overrideTag}${gapTag}
      </div>
      <div style="font-size:10px;color:#ccc;align-self:center;flex-shrink:0;">tap</div>
    </div>`;
  }

  function section(title,color,dot,items){
    if(!items.length)return'';
    return`<div style="margin-bottom:1.5rem;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${color};margin-bottom:10px;display:flex;align-items:center;gap:7px;">
        <span style="width:8px;height:8px;border-radius:50%;background:${dot};flex-shrink:0;display:inline-block;"></span>${title}<span style="font-size:10px;background:${dot}22;color:${color};padding:1px 7px;border-radius:10px;margin-left:2px;">${items.length}</span>
      </div>
      ${items.map(({bl,gaps,conflict})=>blockCard(bl,gaps,conflict)).join('')}
    </div>`;
  }

  const f=S.todayFilter;
  function tileStyle(key){
    const active=f===key;
    const base='display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;flex:1;min-width:90px;cursor:pointer;transition:all .15s;';
    const colors={covered:'background:#E1F5EE;',coverage:'background:#FAECE7;',partial:'background:#FFF8EC;',conflict:'background:#FAECE7;border:1px solid #D85A30;',all:'background:#F0F0F8;'};
    const activeRing=active?'box-shadow:0 0 0 2.5px #534AB7;':'';;
    return base+(colors[key]||colors.all)+activeRing;
  }

  const dayPicker=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.25rem;">${DAYS.map(d=>`<button onclick="S.selectedDay='${d}';S.todayFilter='all';render()" style="padding:5px 12px;border-radius:8px;font-size:12px;font-weight:${d===today?'700':'400'};border:1px solid ${d===today?'#534AB7':'#ddd'};background:${d===today?'#534AB7':d===realToday?'#EEEDFE':'#fafafa'};color:${d===today?'#fff':d===realToday?'#534AB7':'#555'};cursor:pointer;">${d}${d===realToday&&d!==today?' ·':''}</button>`).join('')}</div>`;

  const allCount=coveredBlocks.length+tempBlocks.length+needsCoverage.length+partialBlocks.length+conflictBlocks.length;
  const summaryBar=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;">
    <div onclick="S.todayFilter=S.todayFilter==='all'?'all':'all';S.todayFilter='all';render()" style="${tileStyle('all')}">
      <span style="font-size:22px;font-weight:800;color:#444;line-height:1;">${allCount}</span>
      <span style="font-size:11px;color:#555;font-weight:600;line-height:1.3;">All<br>Sessions</span>
    </div>
    <div onclick="S.todayFilter=S.todayFilter==='covered'?'all':'covered';render()" style="${tileStyle('covered')}">
      <span style="font-size:22px;font-weight:800;color:#085041;line-height:1;">${coveredBlocks.length+tempBlocks.length}</span>
      <span style="font-size:11px;color:#085041;font-weight:600;line-height:1.3;">Sessions<br>Covered</span>
    </div>
    ${needsCoverage.length||f==='coverage'?`<div onclick="S.todayFilter=S.todayFilter==='coverage'?'all':'coverage';render()" style="${tileStyle('coverage')}">
      <span style="font-size:22px;font-weight:800;color:#993C1D;line-height:1;">${needsCoverage.length}</span>
      <span style="font-size:11px;color:#993C1D;font-weight:600;line-height:1.3;">Need<br>Coverage</span>
    </div>`:''}
    ${partialBlocks.length||f==='partial'?`<div onclick="S.todayFilter=S.todayFilter==='partial'?'all':'partial';render()" style="${tileStyle('partial')}">
      <span style="font-size:22px;font-weight:800;color:#b87a00;line-height:1;">${partialBlocks.length}</span>
      <span style="font-size:11px;color:#b87a00;font-weight:600;line-height:1.3;">Partial<br>Issue</span>
    </div>`:''}
    ${conflictBlocks.length||f==='conflict'?`<div onclick="S.todayFilter=S.todayFilter==='conflict'?'all':'conflict';render()" style="${tileStyle('conflict')}">
      <span style="font-size:22px;font-weight:800;color:#D85A30;line-height:1;">${conflictBlocks.length}</span>
      <span style="font-size:11px;color:#D85A30;font-weight:600;line-height:1.3;">Staff<br>Conflicts</span>
    </div>`:''}
  </div>`;

  const staffBanner=S.calledOut.length?`<div style="background:#FFF3EE;border:1px solid #F0997B;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span style="font-size:12px;font-weight:700;color:#4A1B0C;flex-shrink:0;">🚨 Called out:</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;flex:1;">${S.calledOut.map(co=>{const s=gsN(co.sid);return`<span style="background:#F5C4B3;color:#4A1B0C;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;">${s?.name||'?'} <span style="opacity:.7">(${coLabel(co)})</span> <span onclick="event.stopPropagation();rmCO('${co.sid}')" style="cursor:pointer;font-weight:800;margin-left:3px;">×</span></span>`;}).join('')}</div>
  </div>`:'';
  const clientBanner=S.calledOutClients.length?`<div style="background:#F0F0FE;border:1px solid #AFA9EC;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span style="font-size:12px;font-weight:700;color:#3C3489;flex-shrink:0;">📵 Cancelled:</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;flex:1;">${S.calledOutClients.map(cid=>{const c=gcN(cid);return`<span style="background:#EEEDFE;color:#3C3489;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;">${c?.name||'?'} <span onclick="event.stopPropagation();rmClientCO('${cid}')" style="cursor:pointer;font-weight:800;margin-left:3px;">×</span></span>`;}).join('')}</div>
  </div>`:'';

  // Apply filter
  let mainContent;
  if(blocks.length===0){
    mainContent=`<div style="text-align:center;padding:3rem 1rem;color:#aaa;font-size:13px;">No sessions scheduled for ${today}${S.calledOutClients.length?' (some clients cancelled)':''}</div>`;
  } else if(f==='covered'){
    const combined=[...coveredBlocks,...tempBlocks];
    mainContent=combined.length?`${section('Covered','⁠#085041','#1D9E75',coveredBlocks)}${section('Temp Blocks','#185FA5','#85B7EB',tempBlocks)}`:`<div style="text-align:center;padding:2rem;color:#aaa;font-size:13px;">No covered sessions</div>`;
  } else if(f==='coverage'){
    mainContent=needsCoverage.length?section('Needs Coverage','#993C1D','#E24B4A',needsCoverage):`<div style="text-align:center;padding:2rem;color:#aaa;font-size:13px;">No uncovered sessions — all good!</div>`;
  } else if(f==='partial'){
    mainContent=partialBlocks.length?section('Partial Issue','#b87a00','#EF9F27',partialBlocks):`<div style="text-align:center;padding:2rem;color:#aaa;font-size:13px;">No partial issues</div>`;
  } else if(f==='conflict'){
    mainContent=conflictBlocks.length?section('Staff Conflicts','#D85A30','#D85A30',conflictBlocks):`<div style="text-align:center;padding:2rem;color:#aaa;font-size:13px;">No staff conflicts</div>`;
  } else {
    mainContent=`${section('Needs Coverage','#993C1D','#E24B4A',needsCoverage)}${section('Staff Conflicts','#D85A30','#D85A30',conflictBlocks)}${section('Partial Gap','#b87a00','#EF9F27',partialBlocks)}${section('Covered','#085041','#1D9E75',coveredBlocks)}${section('Temp Blocks','#185FA5','#85B7EB',tempBlocks)}`;
  }

  // Build "Today's Changes" summary — auto-detects non-standard assignments and times
  const iso=todayISO();
  const changeItems=[];
  // 1. Staff callouts
  S.calledOut.forEach(co=>{
    const s=gsN(co.sid);if(!s)return;
    changeItems.push({icon:'🚨',color:'#993C1D',bg:'#FFF3EE',border:'#F0997B',text:'<strong>'+s.name+'</strong> called out',sub:coLabel(co),
      undo:{type:'staff-callout',sid:co.sid,label:'Restore '+s.name}});
  });
  // 2. Client cancellations
  S.calledOutClients.forEach(cid=>{
    const c=gcN(cid);if(!c)return;
    changeItems.push({icon:'📵',color:'#3C3489',bg:'#F0F0FE',border:'#AFA9EC',text:'<strong>'+c.name+'</strong> cancelled today',
      undo:{type:'client-cancel',cid,label:'Restore '+c.name}});
  });
  // 3. Today-only time adjustments (client coming at different time than scheduled)
  Object.entries(S.clientOverrides).forEach(([cid,ovList])=>{
    if(!Array.isArray(ovList))return;
    const todayOvs=ovList.filter(o=>o.date===iso||(o.day===today&&!o.date));
    if(!todayOvs.length)return;
    const c=gcN(cid);if(!c)return;
    const permBlocks=c.schedule[today]||[];
    todayOvs.forEach(ov=>{
      const orig=permBlocks[ov.blockIdx];
      const origTime=orig?orig.from+'–'+orig.to:'(no perm block)';
      changeItems.push({icon:'📅',color:'#b87a00',bg:'#FFF8EC',border:'#EF9F27',
        text:'<strong>'+c.name+'</strong> time changed today',
        sub:'Block '+(ov.blockIdx+1)+': normally '+origTime+' → today '+ov.from+'–'+ov.to,
        undo:{type:'time-override',cid,blockIdx:ov.blockIdx,label:'Revert time'}});
    });
  });
  // 4. Staff covering a client they are NOT the permanent assigned staff for.
  //    Three cases: (a) staff override assigned via callout tool today,
  //                 (b) permanent block has different staff than today's effective staff,
  //                 (c) staff is covering a client they have NO permanent blocks with at all.
  const seenSubs=new Set(); // deduplicate by "staffId|clientId"
  getDayBlocks(today).forEach(bl=>{
    if(!bl.staffId||bl.isTemp)return;
    const c=gcN(bl.client.id);if(!c)return;
    const sub=gsN(bl.staffId);if(!sub)return;
    const permBlocks=c.schedule[today]||[];
    const permBlock=permBlocks[bl.blockIdx];
    const permStaffId=permBlock?.staffId||null;
    // Is this staff member the permanent staff for ANY block of this client today?
    const isPermanentForClient=permBlocks.some(pb=>pb.staffId===bl.staffId);
    // Case (a)/(b): someone else is normally assigned and today's staff is different
    const isDifferentFromPerm=permStaffId&&permStaffId!==bl.staffId;
    // Case (c): this staff has no permanent block with this client today at all
    const hasNoPermanentRole=!isPermanentForClient;
    // Also catch: block was unassigned in the permanent schedule, filled today via staff override
    const wasUnassignedFilled=bl.staffOverridden&&bl.origStaffId===null&&!permStaffId;
    if((isDifferentFromPerm||hasNoPermanentRole||wasUnassignedFilled)&&!isStaffOut(bl.staffId)){
      const key=bl.staffId+'|'+c.id;
      if(!seenSubs.has(key)){
        seenSubs.add(key);
        const permName=permStaffId?gsN(permStaffId)?.name:null;
        changeItems.push({icon:'🔄',color:'#185FA5',bg:'#E6F1FB',border:'#85B7EB',
          text:'<strong>'+sub.name+'</strong> covering <strong>'+c.name+'</strong>',
          sub:(permName?'Usually: '+permName+' • ':'Not their regular client • ')+bl.from+'–'+bl.to,
          undo:{type:'staff-assign',cid:c.id,day:today,blockIdx:bl.blockIdx,label:'Remove assignment'}});
      }
    }
    // Also catch splits where a segment is covered by non-permanent staff
    if(bl.splits&&bl.splits.length){
      bl.splits.forEach(sp=>{
        if(sp.sid===bl.staffId)return;
        const spSub=gsN(sp.sid);if(!spSub)return;
        const spIsPerm=permBlocks.some(pb=>pb.staffId===sp.sid);
        if(!spIsPerm&&!isStaffOut(sp.sid)){
          const key2=sp.sid+'|'+c.id;
          if(!seenSubs.has(key2)){
            seenSubs.add(key2);
            const permName=permStaffId?gsN(permStaffId)?.name:null;
            changeItems.push({icon:'🔄',color:'#185FA5',bg:'#E6F1FB',border:'#85B7EB',
              text:'<strong>'+spSub.name+'</strong> covering <strong>'+c.name+'</strong> ('+sp.from+'–'+sp.to+')',
              sub:permName?'Usually: '+permName:'Not their regular client'});
          }
        }
      });
    }
  });
  // 5. Temp blocks
  (S.tempBlocks||[]).filter(tb=>tb.day===today).forEach(tb=>{
    const c=gcN(tb.cid);const s=gsN(tb.staffId);
    changeItems.push({icon:'📌',color:'#185FA5',bg:'#E6F1FB',border:'#85B7EB',
      text:'<strong>Temp block</strong>'+(tb.label?' – '+tb.label:'')+(c?' for '+c.name:''),
      sub:tb.from+'–'+tb.to+(s?' • '+s.name:'')+(tb.staffId?'':' • Unassigned'),
      undo:{type:'temp-block',tempId:tb.id,label:'Delete block'}});
  })
  // Assign each change item a stable key; store in window._ackKeyMap keyed by integer index
  window._ackKeyMap = {};
  window._changeItemsData = changeItems;
  changeItems.forEach(function(ci,i){
    var safeKey = String(i) + '_' + String(ci.sub||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
    ci._key = safeKey;
    window._ackKeyMap[i] = safeKey;
  });
  window._changesPanelHTML=(function(){
    var rows='';
    if(changeItems.length){
      var ackedCount=changeItems.filter(function(ci){return isAcked(ci._key);}).length;
      rows=changeItems.map(function(ci,i){
        var acked=isAcked(ci._key);
        var bg=acked ? 'background:#f5f5f3;border:1px solid #ddd;opacity:.65;' : 'background:'+ci.bg+';border:1px solid '+ci.border+';';
        var textColor=acked ? '#888' : ci.color;
        var subColor=acked ? '#aaa' : ci.color;
        var btnStyle=acked ? 'background:#d4edda;color:#1D9E75;border:1px solid #1D9E75;' : 'background:#fff;color:#aaa;border:1px solid #ddd;';
        var btnLabel=acked ? '&#10003; Seen' : '&#10003;';
        var btnTitle=acked ? 'Unacknowledge' : 'Mark as seen';
        var subHtml=ci.sub ? '<div style="font-size:11px;color:'+subColor+';opacity:.7;margin-top:1px;">'+ci.sub+'</div>' : '';
        var undoBtn='';
        if(ci.undo&&!acked){
          undoBtn='<button onclick="undoChangeItem('+i+')" title="'+ci.undo.label+'" style="flex-shrink:0;cursor:pointer;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;font-family:inherit;background:#fff3f3;color:#993C1D;border:1px solid #f0a090;">↩ Undo</button>';
        }
        return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;'+bg+'">'
          +'<span style="font-size:14px;flex-shrink:0;">'+ci.icon+'</span>'
          +'<div style="flex:1;min-width:0;">'
          +'<div style="font-size:12px;color:'+textColor+';">'+ci.text+'</div>'
          +subHtml
          +'</div>'
          +'<div style="display:flex;gap:4px;flex-shrink:0;align-items:center;">'
          +undoBtn
          +'<button onclick="togAckIdx('+i+')" title="'+btnTitle+'" style="cursor:pointer;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;font-family:inherit;'+btnStyle+'">'+btnLabel+'</button>'
          +'</div>'
          +'</div>';
      }).join('');
      if(ackedCount>0&&ackedCount<changeItems.length){
        rows+='<div style="font-size:10px;color:#aaa;text-align:right;margin-top:2px;">'+ackedCount+' of '+changeItems.length+' acknowledged</div>';
      } else if(ackedCount===changeItems.length){
        rows+='<div style="font-size:10px;color:#1D9E75;text-align:right;margin-top:2px;font-weight:600;">&#10003; All acknowledged</div>';
      }
    } else {
      rows='<div style="font-size:12px;color:#aaa;">No changes from the regular schedule today.</div>';
    }
    var unackedCount=changeItems.filter(function(ci){return !isAcked(ci._key);}).length;
    var badge='';
    if(changeItems.length){
      badge=unackedCount>0
        ? '<span style="font-size:10px;background:#E24B4A;color:#fff;padding:1px 8px;border-radius:10px;margin-left:6px;">'+unackedCount+' new</span>'
        : '<span style="font-size:10px;background:#1D9E75;color:#fff;padding:1px 8px;border-radius:10px;margin-left:6px;">&#10003; all seen</span>';
    }
    return '<div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px 16px;margin-bottom:1.25rem;">'
      +'<div style="font-size:12px;font-weight:700;color:#333;margin-bottom:10px;display:flex;align-items:center;">Today\'s Changes'+badge+'</div>'
      +'<div style="display:flex;flex-direction:column;gap:6px;">'+rows+'</div>'
      +'</div>';
  })()

  const sidebar=`<div class="sidebar">
    <div class="ss">
      <div class="sl" style="font-size:12px;font-weight:700;margin-bottom:8px;">Quick Actions</div>
      <button class="push-btn" style="width:100%;justify-content:center;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:7px;" onclick="pushToPortal()">📤 Push to Staff Portal</button>
      <button class="btn btn-b" style="width:100%;justify-content:center;margin-bottom:6px;" onclick="openTempModal('${today}')">+ Add Temp Block</button>
      <button class="btn btn-g" style="width:100%;justify-content:center;" onclick="doSave()">💾 Save</button>
    </div>
    <div class="ss">
      <div class="sl">🚨 Staff Callout</div>
      <select id="co-sel" style="margin-bottom:5px;"><option value="">Select staff…</option>${S.staff.map(s=>{const cos=getStaffCallout(s.id);const lbl=cos.length?cos.map(co=>' ('+coLabel(co)+')').join(''):'';return`<option value="${s.id}">${s.name}${lbl}</option>`;}).join('')}</select>
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Partial time out (blank = all day)</div>
      <div style="display:flex;gap:4px;margin-bottom:6px;align-items:center;">
        <select id="co-from" style="flex:1;font-size:11px;padding:4px 5px;"><option value="">From…</option>${TIMES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
        <span style="font-size:10px;color:#888;">–</span>
        <select id="co-to" style="flex:1;font-size:11px;padding:4px 5px;"><option value="">To…</option>${TIMES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
      </div>
      <button class="btn btn-d" style="width:100%;" onclick="mkCO()">Mark Called Out</button>
    </div>
    <div class="ss">
      <div class="sl">📵 Client Cancellation</div>
      <select id="client-co-sel" style="margin-bottom:6px;"><option value="">Select client…</option>${S.clients.map(c=>`<option value="${c.id}"${S.calledOutClients.includes(c.id)?' disabled':''}>${c.name}${S.calledOutClients.includes(c.id)?' (cancelled)':''}</option>`).join('')}</select>
      <button class="btn" style="width:100%;background:#534AB7;color:#fff;border-color:#534AB7;" onclick="mkClientCO()">Mark Cancelled</button>

      <select id="tod-client-sel" style="margin-bottom:6px;" onchange="renderTodayOverrideBlocks()"><option value="">Select client…</option>${S.clients.map(c=>{const hasOv=(S.clientOverrides[c.id]||[]).length>0;return`<option value="${c.id}">${c.name}${hasOv?' ✓':''}</option>`;}).join('')}</select>
      <div id="tod-block-list" style="font-size:11px;color:#888;">Select a client to see their blocks.</div>
    </div>
  </div>`;

  return`<div style="width:100%;display:flex;align-items:flex-start;">
    <div class="content" style="flex:1;min-width:0;padding:1.25rem;">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:1rem;flex-wrap:wrap;">
        <div style="font-size:17px;font-weight:700;color:#111;">${today===realToday?'Today':'Sessions — '+today}</div>
        ${today===realToday?`<div style="font-size:12px;color:#888;">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>`:''}
        ${today!==realToday?`<span style="font-size:11px;background:#EEEDFE;color:#534AB7;padding:2px 8px;border-radius:8px;">not today</span>`:''}
        ${f!=='all'?`<button onclick="S.todayFilter='all';render()" style="font-size:11px;background:#f0f0f0;border:none;border-radius:6px;padding:3px 10px;cursor:pointer;color:#555;">Clear filter ×</button>`:''}
      </div>
      ${dayPicker}
      <div id="changes-panel-mount"></div>
      ${staffBanner}${clientBanner}
      ${summaryBar}
      ${mainContent}
    </div>
    ${sidebar}
  </div>`;
}
function rWeek(){const byDay={};DAYS.forEach(d=>byDay[d]=getDayBlocks(d));const total=Object.values(byDay).reduce((s,a)=>s+a.length,0);const cov=Object.values(byDay).reduce((s,a)=>s+a.filter(x=>x.staffId&&!isStaffOut(x.staffId)).length,0);const cols=DAYS.map(d=>{const blocks=byDay[d];const isToday=d===todayDay();const inner=blocks.length===0?`<div style="padding:8px;font-size:11px;color:#888">No sessions</div>`:blocks.map(bl=>{const co=bl.staffId&&S.calledOut.some(c=>c.sid===bl.staffId&&(c.fromM===undefined||(t2m(bl.from)>=c.fromM&&t2m(bl.from)<c.toM)));const dayConflicts=getConflictingStaffOnDay(d);const hasConflict=bl.staffId&&dayConflicts.has(bl.staffId)&&!co;const gaps=getPartialGaps(bl,d);const cls=bl.isTemp?'wtmp':co?'wco':hasConflict?'wconflict':gaps?'wpartial':bl.staffId?'wa':'wu';let sname;if(!bl.staffId){sname='Tap to assign';}else if(co){sname=`\u26a0 ${gsN(bl.staffId)?.name} (out)`;}else if(hasConflict){sname=`\u26a0 ${gsN(bl.staffId)?.name} (conflict)`;}else if(bl.splits&&bl.splits.length>1){sname=bl.splits.map(sp=>`${gsN(sp.sid)?.name} ${sp.from}\u2013${sp.to}`).join(' | ');}else{sname=gsN(bl.staffId)?.name||'?';}const overrideLine=bl.overridden?`<div class="wsb-gap">📅 Today only: ${bl.from}\u2013${bl.to}</div>`:'';const gapLine=gaps?`<div class="wsb-gap">\u23F1 ${gaps}</div>`:'';const bkey=regBlock('w_'+bl.client.id+'_'+d+'_'+bl.from.replace(/ /g,'')+(bl.isTemp?bl.tempId:bl.blockIdx),{cid:bl.client.id,day:d,blockIdx:bl.blockIdx??-1,isTemp:!!bl.isTemp,tempId:bl.tempId||null});const delBtn=bl.isTemp?`<button class="wsb-del" onclick="event.stopPropagation();deleteTempBlock('${bl.tempId}')" title="Delete block">\u2715</button>`:`<button class="wsb-del" onclick="event.stopPropagation();deleteBlock('${bl.client.id}','${d}',${bl.blockIdx})" title="Delete block">\u2715</button>`;return`<div class="wsl"><div class="wsb ${cls}" onclick="openBlock('${bkey}')"><div class="wsb-info"><div class="wsb-time">${fmtBlock(bl)}${bl.isTemp?' \u2022 TEMP':''}</div><div class="wsb-client">${bl.client.name}</div><div class="wsb-staff">${sname}</div>${overrideLine}${gapLine}</div>${delBtn}</div></div>`;}).join('');return`<div class="wdc" style="${isToday?'border-color:#7F77DD':''}"><div class="wdh" style="${isToday?'background:#EEEDFE;color:#3C3489':''}"><span>${d}${isToday?' <span style="font-size:9px;background:#7F77DD;color:#fff;padding:1px 5px;border-radius:8px;margin-left:3px">Today</span>':''}</span><span style="font-size:9px;color:#888;margin-left:4px">${blocks.length}</span><button class="btn btn-sm" style="margin-left:auto;font-size:10px;background:#E6F1FB;color:#0C447C;border-color:#85B7EB" onclick="openTempModal('${d}')">+ Temp</button></div>${inner}</div>`;}).join('');
return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">This week</div><div style="background:#E6F1FB;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#042C53">Total</div><div style="font-size:20px;font-weight:500;color:#042C53">${total}</div></div><div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div><div style="background:#FAECE7;border-radius:7px;padding:.625rem"><div style="font-size:10px;color:#4A1B0C">Gaps</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${total-cov}</div></div></div><div class="ss" style="font-size:11px;color:#888;line-height:1.6">Click a block to reassign staff.<br>Click <strong>&#x2715;</strong> on a block to delete it.</div></div><div class="content"><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;font-size:10px;color:#777"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E1F5EE;display:inline-block"></span>Covered</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FFF8EC;border:1px solid #EF9F27;display:inline-block"></span>Partial coverage</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1px dashed #F0997B;display:inline-block"></span>Needs coverage</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E6F1FB;border:1px dashed #85B7EB;display:inline-block"></span>Temp</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#F5C4B3;display:inline-block"></span>Called out</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1px solid #D85A30;display:inline-block"></span>⚠ Conflict</span></div><div style="overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-width:600px">${cols}</div></div></div></div>`;}

function rClients(){const c=gcN(S.selClient);const pods=S.pods[S.selClient]||[];return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Clients (${S.clients.length})</div><select style="margin-bottom:6px" onchange="selC(this.value)">${S.clients.map(cl=>`<option value="${cl.id}"${cl.id===S.selClient?'selected':''}>${cl.name}</option>`).join('')}</select><button class="add-btn" onclick="addC()">+ Add client</button></div></div><div class="content">${c?`<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-c" style="width:32px;height:32px;font-size:12px">${ini(c.name)}</div><div class="ct">${c.name}</div></div><button class="btn btn-d btn-sm" onclick="rmC('${c.id}')">Delete</button></div><div style="background:#E6F1FB;border:1px solid #85B7EB;border-radius:8px;padding:.75rem;margin-bottom:.875rem;font-size:12px;color:#042C53;line-height:1.6"><strong>How to set up the schedule:</strong> Click a day to activate it, then use <strong>+ Add block</strong> to add time blocks. Set the start and end time for each block and choose which staff member covers it. Add multiple blocks per day for split shifts.</div>${rBlockBuilder(c)}</div><div class="card"><div class="ch"><div class="ct">Pod members</div><span style="font-size:11px;color:#888">${pods.length} staff</span></div><p style="font-size:11px;color:#888;margin-bottom:.5rem">Click to add/remove (4\u20137 recommended)</p><div class="pg">${S.staff.map(s=>{const inp=pods.includes(s.id);const sc=overlap(s.id,c.id);return`<div class="pm ${inp?'ip':''}" onclick="togPod('${c.id}','${s.id}')"><div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(s.name)}</div><div><div style="font-size:11px;font-weight:500">${s.name}</div><div style="font-size:10px;color:#888">${sc} overlap</div></div>${inp?'<span style="color:#185FA5;margin-left:auto">\u2713</span>':''}</div>`;}).join('')}</div></div>`:'<div class="es">Select a client</div>'}</div></div>`;}

function rBlockBuilder(c){const activeDays=DAYS.filter(d=>c.schedule[d]);let html=`<div class="blk-builder"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem"><h4 style="font-size:11px;font-weight:500;color:#777;text-transform:uppercase;letter-spacing:.04em">Schedule by day</h4></div><div class="dr2" style="margin-bottom:1rem">`;DAYS.forEach(d=>{const on=activeDays.includes(d);html+=`<button class="dp${on?' on':''}" onclick="toggleDay('${c.id}','${d}')">${d}</button>`;});html+=`</div>`;if(activeDays.length===0){html+=`<div class="it">Click a day above to start building the schedule.</div></div>`;return html;}activeDays.forEach(d=>{const blocks=c.schedule[d]||[];html+=`<div class="blk-day-row"><div class="blk-day-label">${d}</div><div class="blk-list">`;blocks.forEach((blk,idx)=>{const fromOpts=TIMES.map(t=>`<option value="${t}"${t===blk.from?'selected':''}>${t}</option>`).join('');const toOpts=TIMES.map(t=>`<option value="${t}"${t===blk.to?'selected':''}>${t}</option>`).join('');const curStaffOpts=['<option value="">-- Unassigned --</option>'].concat((S.pods[c.id]||[]).map(sid=>{const s=gsN(sid);return s?`<option value="${sid}"${sid===blk.staffId?'selected':''}>${s.name}</option>`:'';})).join('');const hasStaff=!!blk.staffId;html+=`<div class="blk-item${hasStaff?' has-staff':' no-staff'}"><select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockFrom('${c.id}','${d}',${idx},this.value)">${fromOpts}</select><span style="font-size:11px;color:#888">to</span><select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockTo('${c.id}','${d}',${idx},this.value)">${toOpts}</select><select class="blk-staff-sel" style="font-size:11px;padding:3px 5px" onchange="updateBlockStaff('${c.id}','${d}',${idx},this.value)">${curStaffOpts}</select><button class="blk-del" onclick="deleteBlock('${c.id}','${d}',${idx})" title="Remove block">\u2715</button></div>`;});html+=`</div><button class="btn btn-sm" style="font-size:11px;color:#534AB7;border-color:#534AB7;background:#EEEDFE" onclick="addBlock('${c.id}','${d}')">+ Add block</button></div>`;});html+=`</div>`;return html;}

function rStaff(){const s=gsN(S.selStaff);const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(S.selStaff));return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Staff (${S.staff.length})</div><select style="margin-bottom:6px" onchange="selS(this.value)">${S.staff.map(st=>{const out=isStaffOut(st.id);return`<option value="${st.id}"${st.id===S.selStaff?'selected':''}>${st.name}${out?' (out)':''} \u2014 ${Object.entries(S.pods).filter(([,p])=>p.includes(st.id)).length} pods</option>`;}).join('')}</select><button class="add-btn" onclick="addS()">+ Add staff</button></div></div><div class="content">${s?`<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-s" style="width:32px;height:32px;font-size:12px">${ini(s.name)}</div><div><div class="ct">${s.name}</div><div style="font-size:11px;color:#888">${myC.length} client pods</div></div></div><div style="display:flex;gap:5px">${isStaffOut(s.id)?`<button class="btn btn-sm" onclick="rmCO('${s.id}')">Mark available</button>`:`<button class="btn btn-d btn-sm" onclick="mkOut('${s.id}')">Call out</button>`}<button class="btn btn-d btn-sm" onclick="rmS('${s.id}')">Delete</button></div></div><div class="sx">${rAG(s)}</div></div><div class="card"><div class="ch"><div class="ct">Client pods</div></div>${myC.length===0?`<div style="font-size:12px;color:#888">Not in any pods yet</div>`:myC.map(([cid])=>{const cl=gcN(cid);if(!cl)return'';return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div class="av av-c" style="width:22px;height:22px;font-size:8px">${ini(cl.name)}</div><span style="font-size:12px;flex:1">${cl.name}</span><span style="font-size:10px;color:#888">${overlap(s.id,cid)} overlap</span></div>`;}).join('')}</div>`:'<div class="es">Select a staff member</div>'}</div></div>`;}

function rPods(){
  const view=S.podView||'clients';
  const toggleBtns=`<div style="display:flex;gap:6px;margin-bottom:1.25rem"><button class="btn${view==='clients'?' btn-p':''}" onclick="S.podView='clients';render()">Client pods</button><button class="btn${view==='staff'?' btn-p':''}" onclick="S.podView='staff';render()">Staff pods</button></div>`;
  if(view==='clients'){
    if(!S.selPodClient&&S.clients.length)S.selPodClient=S.clients[0].id;
    const pod=S.pods[S.selPodClient]||[];
    const clientOpts=S.clients.map(cl=>`<option value="${cl.id}"${cl.id===S.selPodClient?'selected':''}>${cl.name}</option>`).join('');
    const podHtml=pod.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">No staff in this pod yet.</div>`:pod.map(sid=>{const st=gsN(sid);if(!st)return'';const out=isStaffOut(sid);const sc=overlap(sid,S.selPodClient);return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,.08)"><div class="av av-s" style="width:28px;height:28px">${ini(st.name)}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${st.name}</div><div style="font-size:11px;color:#888">${sc} overlap${out?' \u00b7 <span style="color:#E24B4A">out today</span>':''}</div></div><button class="btn btn-d btn-sm" onclick="removePodMember('${S.selPodClient}','${sid}')">Remove</button></div>`;}).join('');
    const ok=pod.length>=4&&pod.length<=7;

  }

  const staffOpts=S.staff.map(st=>`<option value="${st.id}"${st.id===S.selPodStaff?'selected':''}>${st.name}</option>`).join('');
  const podsHtml=myClients.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">Not in any client pods yet.</div>`:myClients.map(([cid])=>{const c=gcN(cid);if(!c)return'';const sc=overlap(S.selPodStaff,cid);const pod=S.pods[cid]||[];return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,.08)"><div class="av av-c" style="width:28px;height:28px">${ini(c.name)}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${c.name}</div><div style="font-size:11px;color:#888">${sc} overlap \u00b7 ${pod.length} in pod</div></div><button class="btn btn-d btn-sm" onclick="removePodMember('${cid}','${S.selPodStaff}')">Remove</button></div>`;}).join('');
  const notInFor=S.clients.filter(c=>!(S.pods[c.id]||[]).includes(S.selPodStaff));
  const candidatesHtml2=notInFor.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">Already in every client's pod.</div>`:notInFor.map(c=>{const sc=overlap(S.selPodStaff,c.id);const podSize=(S.pods[c.id]||[]).length;const podOk=podSize>=4&&podSize<=7;const schedDays=DAYS.filter(d=>(c.schedule[d]||[]).length>0);const schedSummary=schedDays.length?schedDays.map(d=>{const blocks=c.schedule[d];const first=blocks[0],last=blocks[blocks.length-1];return d+' '+first.from+'\u2013'+last.to;}).join(', '):'No schedule set';return`<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(0,0,0,.1);border-radius:8px;margin-bottom:6px;background:#fafaf9"><div class="av av-c" style="width:30px;height:30px;flex-shrink:0">${ini(c.name)}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${c.name}</span><span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${podOk?'#C0DD97':'#F5C4B3'};color:${podOk?'#173404':'#4A1B0C'}">${podSize} in pod</span><span style="font-size:10px;color:#0F6E56;background:#E1F5EE;padding:1px 6px;border-radius:8px">${sc} overlap slots</span></div><div style="font-size:11px;color:#888;margin-top:2px;line-height:1.4">${schedSummary}</div></div><button class="btn btn-p btn-sm" style="flex-shrink:0" onclick="addStaffToPodDirect('${S.selPodStaff}','${c.id}')">+ Add</button></div>`;}).join('');
  const allStaffHtml=S.staff.map(st=>{const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(st.id));const out=isStaffOut(st.id);const isSelected=st.id===S.selPodStaff;const stAvailDays=DAYS.filter(d=>(st.availability[d]||[]).length>0);const stAvailStr=stAvailDays.length?stAvailDays.map(d=>{const sl=st.availability[d];return d+' '+sl[0]+'2013'+availEnd(sl);}).join(' \u00b7 '):'No availability set';return`<div class="card" style="margin:0;cursor:pointer;${isSelected?'border-color:#534AB7;outline:2px solid #EEEDFE;':''}" onclick="S.selPodStaff='${st.id}';render()"><div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><div class="av av-s" style="width:26px;height:26px">${ini(st.name)}</div><div style="flex:1"><div style="font-size:12px;font-weight:500">${st.name}${out?' <span style="color:#E24B4A;font-size:10px">(out)</span>':''}</div><div style="font-size:10px;color:#888">${myC.length} client${myC.length!==1?'s':''}</div></div></div><div style="font-size:10px;color:#888;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid rgba(0,0,0,.08);line-height:1.5">${stAvailStr}</div>${myC.map(([cid])=>{const c=gcN(cid);if(!c)return'';const schedDays=DAYS.filter(d=>(c.schedule[d]||[]).length>0);const schedStr=schedDays.length?schedDays.join(','):'no sched';const podSize=(S.pods[cid]||[]).length;return`<div style="padding:3px 0;font-size:11px;border-top:0.5px solid rgba(0,0,0,.05)"><div style="display:flex;align-items:center;gap:5px"><div class="av av-c" style="width:16px;height:16px;font-size:7px">${ini(c.name)}</div><span style="flex:1">${c.name}</span><span style="font-size:9px;color:#999">${podSize}/pod</span></div><div style="font-size:9px;color:#999;margin-left:21px">${schedStr}</div></div>`;}).join('')}</div>`;}).join('');
